<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Utah Jazz Dashboard</title>
<meta name="description" content="Utah Jazz team stats against the league, player stats, lineups, on/off, shot charts, and statistical models in one static page.">
<meta property="og:type" content="website">
<meta property="og:title" content="Utah Jazz Dashboard">
<meta property="og:description" content="Utah Jazz team stats against the league, player stats, lineups, on/off, shot charts, and statistical models in one static page.">
<meta property="og:url" content="https://maximhoeft94.github.io/jazz-dashboard/">
<meta property="og:image" content="https://maximhoeft94.github.io/jazz-dashboard/screenshots/overview.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3e9da; --panel:#ffffff; --ink:#15112a; --muted:#625c78; --line:#dcd9e8; --soft:#f6f5fb;
  --jazz:#4b2a85; --gold:#e9a825; --good:#0b8a4f; --bad:#c8202f;
  --div:#4b2a85; --a:#4b2a85; --b:#e8590c;
  --hot:#d1495b; --cold:#3b6fb6; --mid:#e6e4ee;
  --font-d:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --font-b:'Barlow','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 56px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--div);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px}
.asof{font-size:14px;font-weight:500;color:var(--muted)}
.brand{font-family:var(--font-d);font-weight:700;font-size:20px;letter-spacing:.02em}
.brand small{font-family:var(--font-b);font-weight:500;font-size:13px;color:var(--muted);margin-left:8px;letter-spacing:0}
.banner{background:color-mix(in srgb,var(--b) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--b) 55%,var(--line));border-radius:6px;padding:10px 14px;margin-bottom:14px;font-size:14px}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;row-gap:2px;border-bottom:3px solid var(--jazz);position:sticky;top:0;z-index:5;background:var(--bg);margin-top:26px}
@media (max-width:820px){.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}}
section,#ovSched,#lpFilters{scroll-margin-top:120px}
section[hidden]{display:none}
.rec{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap;margin:4px 0 18px}
.rec .big{font-family:var(--font-d);font-weight:700;font-size:64px;line-height:.9}
.rec .big small{display:block;font-family:var(--font-b);font-size:13px;font-weight:500;color:var(--muted);margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-width:92px}
.chip b{display:block;font-family:var(--font-d);font-size:22px;line-height:1.1}
.chip span{font-size:12px;color:var(--muted)}
.ha{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--soft);color:var(--muted);min-width:34px;text-align:center}
.ha.h{background:color-mix(in srgb,var(--jazz) 14%,transparent);color:var(--jazz)}
.live{color:var(--bad);font-weight:700}
.mark .note{fill:var(--gold);stroke:none}
.mark .note-s{fill:none;stroke:var(--gold);stroke-width:2.6;stroke-linecap:round}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:5px solid transparent;margin-bottom:-3px;padding:9px 13px 7px;font-family:var(--font-d);font-weight:600;font-size:19px;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--b)}
/* player performance */
.gstat{margin-bottom:14px;padding:20px 24px}
.gsh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.gsh h3{font-family:var(--font-d);font-weight:600;font-size:31px;margin:0}
.sbar{display:grid;grid-template-columns:165px minmax(0,1fr) 290px;gap:20px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sbar:last-child{border-bottom:0}
.sbar .sl{font-size:18px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.strk{position:relative;height:27px;background:var(--soft);border-radius:6px;overflow:visible}
.strk i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--jazz)}
.strk i.neg{background:#c8202f;opacity:.75}
.strk i.pos{background:var(--good);opacity:.8}
.pmtrk::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:#8d87a3}
.sbar .sv b.W{color:var(--good)}
.sbar .sv b.L{color:var(--bad)}
.strk em{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;background:var(--gold);border-radius:1px}
.sbar .sv{display:flex;align-items:baseline;gap:10px}
.sbar .sv b{font-family:var(--font-d);font-size:39px;font-weight:700;min-width:66px;text-align:right;line-height:1}
.sbar .sv small{font-size:17px;color:var(--muted)}
.sbar .sv small.W{color:var(--good);font-weight:600}
.sbar .sv small.L{color:var(--bad);font-weight:600}
@media (max-width:900px){.sbar{grid-template-columns:110px minmax(0,1fr) 170px;gap:12px}.sbar .sl{font-size:14px}.sbar .sv b{font-size:30px}.sbar .sv small{font-size:13px}}
@media (max-width:600px){.sbar{grid-template-columns:78px minmax(0,1fr) 92px;gap:8px}.sbar .sv{flex-direction:column;gap:0;align-items:flex-end}.sbar .sl{font-size:12px}.gsh h3{font-size:24px}}
.pp{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(270px,1fr);gap:0;align-items:stretch;overflow:hidden}
.ppcourt{padding:16px;border-right:1px solid var(--line);display:flex;align-items:flex-start;justify-content:center}
#playerPerf .ppcourt, #lineupPerf .ppcourt{align-items:center}
.ppcourt svg{width:100%;height:auto;display:block}
.ppr.zero{color:#a49fb5}
.ppr.zero b{color:#b7b2c6}
.ppside{display:flex;flex-direction:column}
.ppside .ppc{margin:0;border-bottom:1px solid var(--line)}
.ppside .ppc:last-child{border-bottom:0;flex:1}
@media (max-width:900px){.ppcourt{border-right:0;border-bottom:1px solid var(--line)}}
@media (max-width:900px){.pp{grid-template-columns:1fr}}
.ppside .ppc.namecard{background:color-mix(in srgb,var(--jazz) 7%,var(--panel))}
.ppsel{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ppsel label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex:1 1 200px;max-width:380px}
.ppsel select{flex:none;width:100%;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500}
.zcourt{width:100%;height:auto;display:block}
.zcourt .zl{stroke:#6b4a2f;stroke-width:1.2;stroke-dasharray:5 4;fill:none;opacity:.55}
.zcourt .cl{stroke:#3a2a1c;stroke-width:2.4;fill:none}
.zcourt .zone{stroke:none}
.zcourt .rpt{cursor:pointer}
.zcourt .rpt:hover .zone{filter:brightness(1.06)}
.zcourt text{font-family:var(--font-b)}
.zcourt .zn{font-size:18px;fill:#2b2440}
.zcourt .zv{font-size:23px;font-weight:700;fill:#15112a}
.zcourt .pill{fill:#f6f3ff;stroke:#5b4b9a;stroke-width:1}
.zcourt .pill.two{fill:#eef7ef;stroke:#3f7d52}
.zcourt .lg text{font-size:12px;fill:#2b2440}
.ppc{padding:16px 18px}
.ppc .cap{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#b4692a;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:4px}
.ppname{font-family:var(--font-d);font-weight:700;font-size:34px;line-height:1;text-transform:uppercase;color:var(--jazz)}
.ppmeta{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px;line-height:1.5}
.ppr{display:flex;align-items:baseline;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.ppr:last-child{border-bottom:0}
.ppr b{font-family:var(--font-d);font-size:24px;font-weight:700;letter-spacing:0;color:var(--ink)}
.ppr b small{font-family:var(--font-b);font-size:12px;color:#b4692a;margin-left:6px;font-weight:600}
.ppr b.pts{color:#b4692a}
.ppmini{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:10px}
.ppmini b{color:var(--ink);font-size:13px;margin-left:3px}
#playerPerf .ppside, #lineupPerf .ppside{--pk:1}
#playerPerf .ppc, #lineupPerf .ppc{padding:calc(16px*var(--pk)) 18px}
#playerPerf .ppc .cap, #lineupPerf .ppc .cap{font-size:calc(15px*var(--pk));padding-bottom:calc(8px*var(--pk))}
#playerPerf .ppr, #lineupPerf .ppr{font-size:calc(18px*var(--pk));padding:calc(10px*var(--pk)) 0}
#playerPerf .ppr b, #lineupPerf .ppr b{font-size:calc(36px*var(--pk));line-height:1.05}
#playerPerf .ppr b small, #lineupPerf .ppr b small{font-size:calc(17px*var(--pk))}
#playerPerf .ppmini, #lineupPerf .ppmini{font-size:15px;flex-wrap:wrap}
#playerPerf .ppmini b, #lineupPerf .ppmini b{font-size:20px;margin-left:4px}
#playerPerf .pp, #lineupPerf .pp{grid-template-columns:minmax(0,1.85fr) minmax(330px,1fr)}
@media (max-width:900px){#playerPerf .pp,#lineupPerf .pp{grid-template-columns:1fr}}
/* player v. player */
.pvsel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:end;margin-bottom:14px}
.pvside{display:flex;gap:10px;padding:12px 14px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.pvside.a{border-top:4px solid var(--a)}.pvside.b{border-top:4px solid var(--b)}
.pvside label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex:1 1 0;min-width:0}
.pvside select{flex:none;width:100%;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500}
.pvvs{font-family:var(--font-d);font-weight:700;font-size:28px;color:var(--muted);padding-bottom:16px}
.pvcards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.pvcard{padding:16px 20px}
.pvcard.a{border-left:6px solid var(--a)}.pvcard.b{border-left:6px solid var(--b)}
.pvnm{font-family:var(--font-d);font-weight:700;font-size:32px;line-height:1;text-transform:uppercase}
.pvcard.a .pvnm{color:var(--a)}.pvcard.b .pvnm{color:var(--b)}
.pvmeta{font-size:13px;color:var(--muted);margin:6px 0 12px}
.pvline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pvline b{display:block;font-family:var(--font-d);font-size:34px;line-height:1}
.pvline span{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.pvbox{margin-bottom:14px}
.pvscore{font-size:15px}.pvscore b{font-family:var(--font-d);font-size:22px}
.ca{color:var(--a)}.cb{color:var(--b)}
.h2r{display:grid;grid-template-columns:80px minmax(0,1fr) 150px minmax(0,1fr) 80px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.h2r:last-child{border-bottom:0}
.h2l{text-align:center;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.h2t{display:flex;height:22px;background:var(--soft);border-radius:5px;overflow:hidden}
.h2t.a{justify-content:flex-end}
.h2t i{display:block;height:100%}
.h2t.a i{background:var(--a)}.h2t.b i{background:var(--b)}
.h2t i.neg{opacity:.45}
.h2v{font-family:var(--font-d);font-size:24px;font-weight:600;color:var(--muted)}
.h2v.a{text-align:right}
.h2v.lead{font-weight:700}.h2v.a.lead{color:var(--a)}.h2v.b.lead{color:var(--b)}
.pvgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
.pvstack{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center;margin:8px 0}
.pvsn{font-weight:600}
.pvbar{display:flex;height:34px;border-radius:6px;overflow:hidden;background:var(--soft)}
.pvbar i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:700;color:#fff;cursor:pointer}
.pvzt{margin-top:8px}.pvzt td,.pvzt th{padding:7px 8px}
.pvzt td.lead{font-weight:700}
.pvcourts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pvct{font-family:var(--font-d);font-weight:700;font-size:24px;text-transform:uppercase;margin-bottom:8px}
@media (max-width:900px){
  .pvsel{grid-template-columns:1fr}.pvvs{display:none}
  .pvcards,.pvgrid,.pvcourts{grid-template-columns:1fr}
  .h2r{grid-template-columns:54px minmax(0,1fr) 84px minmax(0,1fr) 54px;gap:6px}.h2v{font-size:18px}.h2l{font-size:11px}
  .pvside{flex-direction:column}
}
hr.seg{border:0;border-top:1px solid #c9c5d6;margin:34px 0 14px}
.ldrs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:820px){.ldrs{grid-template-columns:1fr}}
.ldr{overflow:hidden}
.ldr h3{font-family:var(--font-d);font-weight:600;font-size:21px;margin:0;padding:10px 16px;background:color-mix(in srgb,var(--jazz) 10%,var(--panel));color:var(--jazz);border-bottom:1px solid var(--line)}
.ldr td{padding:9px 12px;vertical-align:middle}
.ldr td.big{font-family:var(--font-d);font-weight:700;font-size:26px;color:var(--ink)}
.ldr .note{font-size:12px;margin-top:1px}
.avgline{font-size:14px;color:var(--muted);margin:-2px 0 6px}
.avgline b{font-family:var(--font-d);font-size:20px;margin:0 2px}
tr.trow{cursor:pointer}
tr.trow:hover td{background:color-mix(in srgb,var(--gold) 12%,var(--panel))}
.appx{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.more{display:block;width:100%;background:var(--soft);border:0;border-top:1px solid var(--line);padding:10px;font-weight:600;color:var(--jazz);border-radius:0 0 8px 8px}
.more:hover{background:color-mix(in srgb,var(--jazz) 8%,var(--soft))}
tr.next td{box-shadow:inset 0 2px 0 var(--b)}
.tab small{font-family:var(--font-b);font-size:13px;font-weight:500;margin-left:6px;color:var(--muted)}

/* hero */
.hero{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:30px 0 20px}
.mark{width:132px;height:132px;flex:none;margin-right:8px}
.mark .f{fill:none;stroke:var(--jazz);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.mark .b{fill:none;stroke:var(--jazz);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.mark .m{fill:none;stroke:var(--jazz);stroke-width:1.5;opacity:.4}
.hero h1{font-family:var(--font-d);font-weight:700;font-size:clamp(56px,10vw,104px);line-height:.88;margin:0;letter-spacing:-.005em}
.hero h1 span{display:block;font-size:.3em;font-weight:600;color:var(--muted);letter-spacing:.01em;margin-bottom:6px}
.hero .circle{position:relative}
.hero .circle::after{content:"";position:absolute;left:-14px;top:-4px;bottom:-4px;width:6px;background:var(--jazz);border-radius:3px}
.hero .circle h1{padding-left:12px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.kpi{padding:14px 16px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
/* 2x4 headline grid: a checkerboard of two Jazz tones, set per theme with variables */
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.kgrid .kpi{position:relative;border-right:1px solid var(--k-line,var(--line));border-bottom:1px solid var(--k-line,var(--line));background:var(--k0);--kv:var(--kv0);--kl:var(--kl0);--ka:var(--ka0)}
.kgrid .kpi:nth-child(4n){border-right:0}
.kgrid .kpi:nth-child(n+5){border-bottom:0}
.kgrid .kpi:is(:nth-child(1),:nth-child(3),:nth-child(6),:nth-child(8)){background:var(--k1);--kv:var(--kv1);--kl:var(--kl1);--ka:var(--ka1)}
.kgrid .kpi .kv{color:var(--kv)}
.kgrid .kpi.sW .kv{color:var(--good)}
.kgrid .kpi.sL .kv{color:var(--bad)}
.kgrid .kpi .kl,.kgrid .kpi .ks{color:var(--kl)}
.kgrid .kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--ka)}
@media (max-width:820px){
  .kgrid{grid-template-columns:1fr 1fr}
  .kgrid .kpi:nth-child(n){border-right:1px solid var(--k-line,var(--line));border-bottom:1px solid var(--k-line,var(--line));background:var(--k0);--kv:var(--kv0);--kl:var(--kl0);--ka:var(--ka0)}
  .kgrid .kpi:nth-child(2n){border-right:0}
  .kgrid .kpi:nth-child(n+7){border-bottom:0}
  .kgrid .kpi:is(:nth-child(1),:nth-child(4),:nth-child(5),:nth-child(8)){background:var(--k1);--kv:var(--kv1);--kl:var(--kl1);--ka:var(--ka1)}
}
.kgrid[data-k="lavender"]{--k0:var(--panel);--k1:color-mix(in srgb,var(--jazz) 10%,var(--panel));--kv0:var(--ink);--kv1:var(--jazz);--kl0:var(--muted);--kl1:#5d4f80;--ka0:var(--gold);--ka1:var(--jazz)}
.kgrid[data-k="night"]{--k0:var(--panel);--k1:var(--jazz);--kv0:var(--jazz);--kv1:#fff;--kl0:var(--muted);--kl1:#d8cdef;--ka0:transparent;--ka1:var(--gold)}
.kgrid[data-k="gold"]{--k0:color-mix(in srgb,var(--jazz) 7%,var(--panel));--k1:color-mix(in srgb,var(--gold) 18%,var(--panel));--kv0:var(--jazz);--kv1:#6e4600;--kl0:var(--muted);--kl1:#7d6331;--ka0:var(--jazz);--ka1:var(--gold)}
.kl{font-size:13px;color:var(--muted)}
.kv{font-family:var(--font-d);font-weight:700;font-size:34px;line-height:1.05;margin-top:2px}
.ks{font-size:13px;color:var(--muted);margin-top:2px}
.rkb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:0 6px;color:#fff;margin-left:4px;vertical-align:2px}

/* sections */
section{margin-top:22px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:10px}
h2{font-family:var(--font-d);font-weight:700;font-size:30px;line-height:1;margin:0}
.note{font-size:13px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.scroll{overflow-x:auto}
.pad{padding:14px 16px}

/* tables */
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{font-weight:600;font-size:13px;color:var(--muted);background:var(--soft);user-select:none}
th[data-ts]{cursor:pointer}
th[data-ts]:hover{color:var(--ink)}
th.on{color:var(--ink)}
th.on::after{content:attr(data-arrow);margin-left:3px;color:var(--div)}
tbody tr:last-child td{border-bottom:0}
td.hl{font-weight:700;background:color-mix(in srgb,var(--div) 9%,transparent)}
tr.me td{background:color-mix(in srgb,var(--jazz) 10%,transparent);font-weight:600}
tr.me td.hl{background:color-mix(in srgb,var(--jazz) 18%,transparent)}
tr.avg td{background:var(--soft);color:var(--muted);font-style:italic;border-top:2px solid var(--line)}
tr.dim td{color:var(--muted)}
.team{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.team .full{font-weight:500;color:var(--muted);font-size:13px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--line)}
.W{color:var(--good);font-weight:700}.L{color:var(--bad);font-weight:700}
.rk{color:var(--muted);width:30px}
.pos{color:var(--muted);font-size:12px;margin-left:6px;font-weight:500}

/* pills */
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
.pill.on{background:var(--div);border-color:var(--div);color:#fff}
.pills .sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.pills .lab{font-size:13px;color:var(--muted);margin-right:2px}

/* rows with bars */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g2>*,.shot>*,.h2h>*{min-width:0}
@media (max-width:820px){.g2{grid-template-columns:1fr}}
.card{padding:14px 16px 10px}
.card h3{font-family:var(--font-d);font-weight:600;font-size:21px;margin:0 0 8px}
.cr{display:grid;grid-template-columns:150px minmax(0,1fr) 62px;gap:8px;align-items:center;padding:4px 0;font-size:14px}
.cr .tm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr .v{text-align:right;font-weight:600}
.trk{height:14px;background:var(--soft);border-radius:3px;overflow:hidden;display:flex}
.trk i{display:block;height:100%}
.dv{display:grid;grid-template-columns:1fr 1fr;height:14px;background:var(--soft);border-radius:3px;overflow:hidden}
.dv .l{display:flex;justify-content:flex-end;border-right:2px solid var(--line)}
.dv .r{display:flex}
.dv i{display:block;height:100%}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 6px}
.lgd b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.lgd b.c{border-radius:50%}

/* strip plots (team vs league) */
.strip{position:relative;height:24px;min-width:200px}
.strip span{position:absolute;top:50%;transform:translate(-50%,-50%)}
.strip .ax{left:0!important;right:0;transform:translateY(-50%);height:1px;background:var(--line)}
.strip .o{width:7px;height:7px;border-radius:50%;background:#b9b4cc}
.strip .me{width:14px;height:14px;border-radius:50%;background:var(--jazz);box-shadow:0 0 0 2px var(--panel);z-index:1}
.strip .avg{width:0;height:20px;border-left:1.5px dashed var(--muted)}
table.vs td{padding:5px 10px}
table.vs td.st{width:42%;min-width:220px}
.better{font-size:11px;color:var(--muted)}

/* svg charts */
.sc{width:100%;height:auto;display:block}
.sc.xy{max-width:780px;margin:0 auto}
.sc text{font-family:var(--font-b);font-size:12px;fill:var(--muted)}
.sc .lab{fill:var(--ink);font-weight:600}
.sc .gl{stroke:var(--line);stroke-width:1}
.sc .ax{stroke:#bdb8cf;stroke-width:1.25}
.sc .avg{stroke:var(--muted);stroke-width:1.25;stroke-dasharray:5 4}
.sc .ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.sc .rpt{cursor:pointer}
.sc .rpt .hit{fill:transparent}
.sc .rpt .dotp{stroke:var(--panel);stroke-width:1.5;transition:stroke-width .1s}
.sc .rpt:hover .dotp{stroke:var(--ink);stroke-width:2.5}

/* selects */
.sel{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
select{font:inherit;font-size:14px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%;min-width:0;flex:1 1 180px}
.sel .ca{border-left:5px solid var(--a)}.sel .cb{border-left:5px solid var(--b)}

/* head to head */
.h2h{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.radar{width:100%;height:auto;display:block;max-width:520px;margin:0 auto}
.radar .ring{fill:none;stroke:var(--line);stroke-width:1}
.radar .spoke{stroke:var(--line);stroke-width:1}
.radar text{font-family:var(--font-b);font-size:13px;fill:var(--ink)}
.radar .rpt{cursor:pointer}
.radar .rpt .hit{fill:transparent}
.radar .rpt .dotp{stroke:var(--panel);stroke-width:2}
.radar .rpt:hover .dotp{stroke:var(--ink);stroke-width:2.5}
.cmp td{padding:6px 8px}
.cmp td.k{text-align:center;color:var(--muted);font-size:13px}
.cmp td.win{font-weight:700;color:var(--ink)}
.cmp td:not(.win):not(.k){color:var(--muted)}
.cmp .a.win{box-shadow:inset 3px 0 0 var(--a)}
.cmp .b.win{box-shadow:inset -3px 0 0 var(--b)}
.cmp td.a{text-align:right}.cmp td.b{text-align:left}

/* model */
.eq{font-size:14px;line-height:1.55;margin:0 0 10px}
.eq b{font-weight:600}
.callout{border-left:4px solid var(--jazz);background:var(--soft);padding:10px 14px;border-radius:0 6px 6px 0;margin-bottom:12px;font-size:14px}
.callout b{font-family:var(--font-d);font-size:22px;font-weight:700;margin-right:4px}

/* tooltip */
.tip{position:fixed;left:0;top:0;z-index:50;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--a);border-radius:6px;padding:7px 11px;font-size:13px;line-height:1.35;box-shadow:0 4px 14px rgba(21,17,42,.16);white-space:nowrap}
.tip.on{opacity:1}
.tip.wrap{white-space:normal;max-width:280px}
.tip span{display:block;color:var(--muted)}
.tip span b{color:var(--ink)}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:3px solid var(--jazz);padding-top:12px}

@media (max-width:820px){
  .hero{padding-top:22px}
  .mark{width:84px;height:84px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi{border-bottom:1px solid var(--line)}
  .kpi:nth-child(2n){border-right:0}
  .kpi:last-child{grid-column:1/-1;border-bottom:0;border-right:0}
  .h2h{grid-template-columns:1fr}
  .cr{grid-template-columns:110px minmax(0,1fr) 56px}

.ga-strip{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px;align-items:end;height:84px;padding:12px 16px 0}
.ga-g{display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.ga-g i{display:block;border-radius:3px 3px 0 0;background:var(--mid)}
.ga-g.w i{background:var(--jazz)}.ga-g.a i{background:var(--gold)}
.ga-g button{position:absolute;inset:0;background:none;border:0;padding:0}
.ga-key{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);padding:8px 16px 12px}
.ga-key s{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;text-decoration:none}
.ga-trends{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:12px 0 22px}
.ga-trends .panel b{display:block;font-family:var(--font-d);font-size:19px;line-height:1.15;margin:4px 0}
.ga-tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;margin-right:6px}
.ga-good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.ga-bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.ga-dice{background:color-mix(in srgb,var(--gold) 22%,transparent);color:#8a5a00}
.ga-ht{background:color-mix(in srgb,var(--jazz) 12%,transparent);color:var(--jazz)}
details.ga{margin:0 0 12px}
details.ga>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px}
details.ga>summary::-webkit-details-marker{display:none}
details.ga>summary:focus-visible{outline:2px solid var(--div);outline-offset:2px;border-radius:8px}
.ga-res{font-family:var(--font-d);font-weight:700;font-size:24px;width:48px;height:48px;border-radius:8px;display:grid;place-items:center;color:#fff;background:var(--jazz)}
.ga-res.l{background:var(--mid);color:var(--ink)}
.ga-tt{font-family:var(--font-d);font-weight:700;font-size:22px;line-height:1.1}
.ga-chev{font-size:24px;color:var(--muted);transition:transform .15s}details.ga[open] .ga-chev{transform:rotate(90deg)}
.ga-body{border-top:1px solid var(--line);padding:4px 16px 18px}
.ga-verdict{font-size:16px;background:var(--soft);border-radius:8px;padding:12px 14px;margin:14px 0}
.ga-verdict b{color:var(--jazz)}
.ga-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ga-box{background:var(--soft);border-radius:8px;padding:12px 14px}
.ga-box h3{font-family:var(--font-d);font-weight:700;font-size:20px;margin:0 0 6px}
.ga-box ul{margin:0;padding-left:18px}.ga-box li{margin:5px 0}
.ga-body h4{font-family:var(--font-d);font-weight:600;font-size:19px;margin:20px 0 8px}
.ga-body td.wrap,.ga-body th.wrap{white-space:normal;text-align:left}
.ga-body td{vertical-align:top}
.ga-h3{font-family:var(--font-d);font-weight:700;font-size:24px;margin:24px 0 0}
.ga-dots{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 4px}.ga-dots span{width:12px;height:12px;border-radius:50%;background:var(--mid)}.ga-dots .g{background:var(--good)}.ga-dots .b{background:var(--bad)}
td.ga-up{color:var(--good);font-weight:600}td.ga-dn{color:var(--bad);font-weight:600}.ga-body td.wrap{min-width:220px}
.ga-wp{width:100%;height:auto;display:block}
.ga-wp text{font-size:12px;fill:var(--muted);font-family:var(--font-b)}
@media (max-width:820px){.ga-2{grid-template-columns:1fr}.ga-strip{height:64px}}
@media (max-width:600px){details.ga>summary{grid-template-columns:auto minmax(0,1fr)}.ga-chev{display:none}.ga-tt{font-size:19px}}

/* ---------- league comparison helpers ---------- */
// dir: 1 = higher is better, -1 = lower is better, 0 = neutral (ranked high to low)
function rankOf(teams, k, dir, ab){
  const v = teams.filter(t => ok(t[k])).sort((a,b) => (dir===-1 ? a[k]-b[k] : b[k]-a[k]));
  const me = v.find(t => t.ab===ab); if(!me) return null;
  return 1 + v.filter(t => (dir===-1 ? t[k] < me[k] : t[k] > me[k])).length;
}

      q.sec += r[2]; q.jp += r[3]; q.op += r[4]; q.g.add(r[0]); r[5].forEach((v,i) => q.j[i] += v); r[6].forEach((v,i) => q.o[i] += v);

function pvpData(X, pid, gsel){
  const raw = X.raw, boxes = raw.boxes || {};
  const rowOf = g => (boxes[g.id]||[]).find(r => String(r[0])===String(pid));
  const played = X.games.filter(g => { const r = rowOf(g); return r && r[1] > 0; });
  const games = gsel==='ALL' ? played : played.filter(g => g.id===gsel);
  const T = {gp:games.length, min:0, pts:0, fgm:0, fga:0, fg3m:0, fg3a:0, ftm:0, fta:0, reb:0, ast:0, tov:0, stl:0, blk:0, pm:0};
  games.forEach(g => { const r = rowOf(g);
    T.min+=r[1]; T.pts+=r[2]; T.fgm+=r[3]; T.fga+=r[4]; T.fg3m+=r[5]; T.fg3a+=r[6]; T.ftm+=r[7]; T.fta+=r[8]; T.reb+=r[9]; T.ast+=r[10]; T.tov+=r[11]; T.stl+=r[12]; T.blk+=r[13]; T.pm+=r[15]; });

    const z = zoneOf({x:r[1], y:r[2], v:r[7]?3:2}); const q = Z[z] || (Z[z] = {m:0,a:0}); q.a++; q.m += r[3]; });
  const byGame = played.map(g => ({g, pts: rowOf(g)[2]}));
  return {T, per, played, games, Z, byGame,
    fgp: T.fga ? 100*T.fgm/T.fga : null, fg3p: T.fg3a ? 100*T.fg3m/T.fg3a : null, ftp: T.fta ? 100*T.ftm/T.fta : null,

function solve(A, b){ // Gaussian elimination with partial pivoting
  const n = b.length, M = A.map((r,i) => r.concat([b[i]]));
  for(let c=0;c<n;c++){
    let p = c; for(let r=c+1;r<n;r++) if(Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]]; if(Math.abs(M[c][c]) < 1e-12) continue;
    for(let r=0;r<n;r++) if(r!==c){ const f = M[r][c]/M[c][c]; for(let k=c;k<=n;k++) M[r][k] -= f*M[c][k]; }
  }
  return M.map((r,i) => Math.abs(r[i])<1e-12 ? 0 : r[n]/r[i]);
}
function wls(Xr, y, w, ridge, skip0){ // weighted (ridge) least squares; ridge not applied to column 0 when skip0
  const k = Xr[0].length, A = Array.from({length:k}, () => new Array(k).fill(0)), b = new Array(k).fill(0);
  Xr.forEach((x,i) => { for(let a=0;a<k;a++){ b[a] += w[i]*x[a]*y[i]; for(let c=0;c<k;c++) A[a][c] += w[i]*x[a]*x[c]; } });
  for(let a=(skip0?1:0); a<k; a++) A[a][a] += ridge;
  return solve(A, b);
}

function mShotQ(X){

function mImpact(X){

    + '<div class="panel card"><h3>Estimated effect on Jazz net rating, per 100 possessions</h3>'+R.map(r => { const wd = (Math.abs(r.b)/mx*100).toFixed(1);
      return '<div class="cr"><span class="tm">'+esc(r.name)+'</span><span class="dv rpt" data-n="'+esc(r.name)+'" data-c="var(--jazz)" data-l="Effect::'+sgn(r.b,1)+' per 100||Lineup possessions::'+r.poss+'"><span class="l">'+(r.b<0?'<i style="width:'+wd+'%;background:var(--bad)"></i>':'')+'</span><span class="r">'+(r.b>0?'<i style="width:'+wd+'%;background:var(--good)"></i>':'')+'</span></span><span class="v num">'+sgn(r.b,1)+'</span></div>'; }).join('')

  if(rows.length < 12) return '<div class="panel empty">Not enough team data yet.</div>';
  const beta = wls(rows.map(r=>r.x), rows.map(r=>r.y), rows.map(r=>r.gp), 0, true);
  const pred = rows.map(r => r.x.reduce((a,v,i)=>a+v*beta[i],0)), ym = mean(rows.map(r=>r.y));
  const r2 = 1 - rows.reduce((a,r,i)=>a+Math.pow(r.y-pred[i],2),0)/rows.reduce((a,r)=>a+Math.pow(r.y-ym,2),0);
  const X = S(), me = rows.find(r => r.s===state.season && r.ab===D.team.ab);
  const cur = rows.filter(r => r.s===state.season), avgx = [1,2,3,4].map(i => mean(cur.map(r=>r.x[i])));

  let h = '<p class="eq">A weighted regression across every team-season loaded ('+rows.length+' rows, R² = '+r2.toFixed(2)+') estimates how much each factor margin is worth in net rating:</p>'
    + '<div class="callout" style="font-size:14px">Net rating ≈ '+beta[0].toFixed(2)+' + <b style="font-size:inherit">'+beta[1].toFixed(2)+'</b> × eFG margin '+(beta[2]>=0?'+ ':'− ')+'<b style="font-size:inherit">'+Math.abs(beta[2]).toFixed(2)+'</b> × TOV margin + <b style="font-size:inherit">'+beta[3].toFixed(2)+'</b> × OREB margin + <b style="font-size:inherit">'+beta[4].toFixed(2)+'</b> × FT-rate margin<br><span class="note">Margins are the team\'s number minus its opponents\'. A TOV margin above zero means more giveaways than takeaways.</span></div>';

    + contrib.map((c,i) => { const w = (Math.abs(c)/mx*100).toFixed(1); return '<div class="cr"><span class="tm" title="'+esc(names[i])+'">'+esc(names[i])+'</span><span class="dv"><span class="l">'+(c<0?'<i style="width:'+w+'%;background:var(--bad)"></i>':'')+'</span><span class="r">'+(c>0?'<i style="width:'+w+'%;background:var(--good)"></i>':'')+'</span></span><span class="v num">'+sgn(c,1)+'</span></div>'; }).join('')
    + '<div class="note" style="margin-top:8px">Model-predicted net rating '+sgn(predJ)+' vs. actual '+sgn(X.J.net)+'. The gap is what the four factors do not explain (shot timing, transition, luck).</div></div>';

}

function hideTip(){ tip.classList.remove('on'); tipFor = null; }
function showTip(g, e){
  if(tipFor !== g){ const t = tipContent(g); tipFor = g; tip.innerHTML = t.html; tip.style.borderLeftColor = t.c; tip.classList.toggle('wrap', t.wrap); }
  tip.classList.add('on'); moveTip(e.clientX, e.clientY);
}
document.addEventListener('pointerover', e => { const g = e.target.closest && e.target.closest(TIPSEL); if(g) showTip(g, e); });
document.addEventListener('pointermove', e => { const g = e.target.closest && e.target.closest(TIPSEL); if(g) showTip(g, e); });
document.addEventListener('pointerout', e => { const g = e.target.closest && e.target.closest(TIPSEL); if(g && !(e.relatedTarget && g.contains(e.relatedTarget))) hideTip(); });
addEventListener('scroll', hideTip, {passive:true});

/* ---------- game analysis (hand-written notes; not touched by fetch_jazz.py) ---------- */
/* Trends: each game tags a trend 'good' or 'bad' in its `tr` field; the cards and dots add up across games. */
const GA_TRENDS = [
  {key:'press', t:'Handling pressure', d:'Breaking full-court traps and double teams without turning it over. Bad when the ballhandler gets trapped into turnovers.'},
  {key:'glass', t:'Offensive rebounds allowed', d:'Ending defensive possessions with a rebound. Bad when the opponent wins the offensive glass.'},
  {key:'pressure', t:'Our own defensive pressure', d:'Trapping and pressuring to force turnovers, then scoring off them.'},
  {key:'george', t:'Keyonte George as the lead scorer', d:'George attacking the other team’s best guard and running the offense.'},
  {key:'fouls', t:'Early foul trouble', d:'Guards picking up quick fouls and giving away free throws.'}
];
const GA_GAMES = [
  {gid:'401910017', date:'Wed, Nov 18', opp:'Los Angeles Lakers', short:'Lakers', where:'Away', res:'W', us:109, them:97, after:'3–13',
   ctx:'Second night of a back-to-back for both teams. The Lakers came in 13–2.',
   verdict:"<b>Won the 4th quarter on forced turnovers,</b> led by Keyonte George, and the Lakers' cold three-point shooting helped. Even with normal shooting from both teams, the Jazz would have won by about 1.",
   quarters:[[29,34],[27,20],[22,22],[31,21]],
   wp:[[0,.15],[6,.15],[13,.11],[17.8,.22],[24,.30],[25.6,.45],[27.5,.30],[31.6,.28],[36,.40],[40.2,.50],[41.4,.75],[44,.80],[48,1]],
   counter:[['Total rebounds',53,58,'26–27'],['Offensive rebounds',7,14,'2–6'],['Turnovers',23,18,'12–6'],['Points off turnovers',26,29,'11–13'],['Shot attempts',77,89,'37–47'],['Free throws','21–27','20–28','10–13 / 14–16']],
   well:["George: 30 points and 10 assists, +16. Second straight 30-point game.","Bamba: 16 rebounds (15 defensive), +17. Owned the defensive glass in the 2nd half.","4th-quarter defense: 13 points off turnovers vs. the Lakers' 2. The 15–0 run decided it.","Bench outscored theirs 32–29. Svi 15 (4/10 3PT), Josh Green a perfect 4/4 for 11.","Rim protection: the Lakers shot about 50% at the rim (8/17 in the 1st half)."],
   hurt:["23 turnovers, 12 in the 1st half. The press and Matisse Thybulle (4 steals) hurt most.","Out-rebounded on the offensive glass 14–7, giving the Lakers 12 more shots.","Fouling early: Peterson had 3 fouls in the 1st quarter and 4 by mid-3rd. The Lakers made 14 of 16 free throws in the 1st half.","Possessions that ended in nothing: bad threes off the dribble, 0/2 from mid-range, a player catching it out of bounds."],
   changes:[['Q1','Josh Okogie on Luka','Luka went from easy layups to missed shots and a bad pass. Slowed the Lakers’ early run.'],['Q2','Cleaned up the defensive glass','The Lakers had zero offensive rebounds for most of the quarter. Helped the Jazz come back from 8 down to tied.'],['Q2','Moved the ball for open threes','Svi hit four catch-and-shoot threes from the left side after kick-outs. That was an 11–3 run.'],['Q3','Peterson split the double team','After being trapped all night, he beat it in the late 3rd and scored. He had 8 points by the end of the quarter, without a 5th foul.'],['Q3–Q4','Jazz started trapping too','They copied the Lakers’ pressure. Forced Lakers turnovers jumped from 9 to 18.'],['Q4','Fouled Kessler instead of giving up dunks','Kessler shot 4 of 10 from the line. A smart trade.']],
   dice:[['Jazz 3P%','44% (8/18)','38% (14/37)','Cooled off, as predicted','ok'],['Lakers 3P%','27% (4/15)','27% (9/33)','Never heated up. Luck in our favor','miss'],['Luka 3P','1 of 8','2 of 12','Stayed cold','miss']],
   height:[['Offensive rebounds','Lakers 6–2','Lakers 14–7','Held. Their biggest edge','ok'],['Turnovers','Jazz 12–6','Jazz 23–18','Flipped in the 2nd half (Lakers 12, Jazz 11)','flip'],['Lakers at the rim','8 of 17','18 of 34','Mostly held, about 50%','ok']],
   luck:'If both teams had shot about 36% from three, the Lakers would have scored about 9 more points and the Jazz about 2 fewer: about Jazz +1 instead of +12.',
   players:[['Keyonte George','30','9-17','5-10','10 ast, 4 TO','+16'],['Svi Mykhailiuk','15','4-10','4-10','5 ast, 4 TO','+16'],['Josh Green','11','4-4','2-2','2 stl, 1 blk','+9'],['Darryn Peterson','11','3-5','1-3','4 PF, 2 TO','+3'],['Mo Bamba','6','3-5','0-1','16 reb, 2 blk','+17'],['Jaxson Hayes','6','2-7','0-0','7 reb, 2 blk','−5']],
   oppPlayers:[['Luka Dončić','29','10-28','2-12','9 TO, 1 tech','−18'],['Collin Sexton','12','4-8','1-2','3 TO','−9'],['Walker Kessler','10','3-7','0-0','11 reb, 4/10 FT','−7'],['Sandro Mamukelashvili','6','1-10','0-4','—','−4']],

function gaWP(pts){
  const W=640,H=190,m={l:40,r:12,t:12,b:24},X=t=>m.l+t/48*(W-m.l-m.r),Y=p=>m.t+(1-p)*(H-m.t-m.b);
  let s='<svg class="ga-wp" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Jazz win probability through the game">';
  [0,.5,1].forEach(p=>{ s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(p)+'" y2="'+Y(p)+'" stroke="var(--line)"'+(p===.5?' stroke-dasharray="4 4"':'')+'/><text x="'+(m.l-6)+'" y="'+(Y(p)+4)+'" text-anchor="end">'+(p*100)+'%</text>'; });
  [12,24,36].forEach(t=>{ s+='<line x1="'+X(t)+'" x2="'+X(t)+'" y1="'+m.t+'" y2="'+(H-m.b)+'" stroke="var(--line)"/>'; });
  ['Q1','Q2','Q3','Q4'].forEach((q,k)=>{ s+='<text x="'+X(k*12+6)+'" y="'+(H-6)+'" text-anchor="middle">'+q+'</text>'; });
  const pl=pts.map(p=>X(p[0])+','+Y(p[1])).join(' ');
  s+='<polygon points="'+X(0)+','+Y(0)+' '+pl+' '+X(48)+','+Y(0)+'" fill="var(--jazz)" opacity=".1"/><polyline points="'+pl+'" fill="none" stroke="var(--jazz)" stroke-width="2.5" stroke-linejoin="round"/>';
  pts.forEach(p=>{ s+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="3.5" fill="var(--jazz)" stroke="#fff" stroke-width="1.5"/>'; });
  return s+'</svg>';
}
function renderGames(){
  const sch = (D.schedule||[]).filter(g=>g.state==='final');
  const W = sch.filter(g=>g.pts>g.opts).length, L = sch.length-W;
  const mx = Math.max(1,...sch.map(g=>Math.abs(g.pts-g.opts)));
  const an = Object.fromEntries(GA_GAMES.map(g=>[g.gid,1]));
  const md = d => new Date(d).toLocaleDateString('en-US',{month:'numeric',day:'numeric',timeZone:'America/Denver'});
  const tagC = {ok:'ga-good',miss:'ga-bad',flip:'ga-dice'}, tagL = {ok:'Held',miss:"Didn’t",flip:'Flipped'};
  const old = GA_GAMES.slice().reverse(); /* oldest first, for anything drawn over time */
  const N = GA_GAMES.length, pl = n => n+' game'+(n===1?'':'s');
  const rv = a => a.map(r=>'<tr><td class="l">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td class="wrap"><span class="ga-tag '+tagC[r[4]]+'">'+tagL[r[4]]+'</span>'+r[3]+'</td></tr>').join('');
  const pt = a => '<div class="panel scroll"><table><thead><tr><th class="l">Player</th><th>Pts</th><th>FG</th><th>3P</th><th class="l">Notes</th><th>+/−</th></tr></thead><tbody>'+a.map(p=>'<tr><td class="l">'+p[0]+'</td><td>'+p[1]+'</td><td>'+p[2]+'</td><td>'+p[3]+'</td><td class="l">'+p[4]+'</td><td>'+p[5]+'</td></tr>').join('')+'</tbody></table></div>';
  const sg = v => (v>0?'+':v<0?'−':'')+Math.abs(v);
  let h = '<div class="sh"><h2>Game analysis</h2><span class="note">What went well, what hurt, and the adjustments that changed each game. '+pl(N)+' analyzed.</span></div>';
  h += '<div class="panel"><div class="ga-strip" style="--n:'+sch.length+'" role="img" aria-label="Season results; bar height is the margin">'
    + sch.map(g=>{ const m=g.pts-g.opts, a=an[g.id]; return '<div class="ga-g'+(m>0?' w':'')+(a?' a':'')+'" title="'+md(g.date)+' '+(g.home?'vs ':'@ ')+g.opp+' '+(m>0?'W':'L')+' '+g.pts+'–'+g.opts+'"><i style="height:'+Math.max(8,Math.abs(m)/mx*100)+'%"></i>'+(a?'<button data-ga="'+g.id+'" aria-label="Open the '+md(g.date)+' analysis"></button>':'')+'</div>'; }).join('')
    + '</div><div class="ga-key"><span><s style="background:var(--jazz)"></s>Win</span><span><s style="background:var(--mid)"></s>Loss</span><span><s style="background:var(--gold)"></s>Analyzed (click to open)</span><span>Bar height = margin · '+W+'–'+L+'</span></div></div>';

  /* trends: tally good/bad tags across games */
  h += '<h3 class="ga-h3">Trends to watch</h3><div class="note">Each card adds up every analyzed game that showed the trend. One dot per game, oldest to newest. '+(N<5?'With '+pl(N)+' so far, treat these as ideas to test.':'')+'</div>';
  h += '<div class="ga-trends">'+GA_TRENDS.map(t=>{
      const seen = old.filter(g=>g.tr&&g.tr[t.key]), good = seen.filter(g=>g.tr[t.key]==='good').length, bad = seen.length-good;
      const k = !seen.length ? 'none' : good>bad ? 'good' : bad>good ? 'bad' : 'mix';
      const lab = {good:'Working',bad:'Not working',mix:'Mixed',none:'Not seen yet'}[k], cls = {good:'ga-good',bad:'ga-bad',mix:'ga-dice',none:''}[k];
      const wl = seen.length ? (' · Jazz went '+seen.filter(g=>g.res==='W').length+'–'+seen.filter(g=>g.res==='L').length+' in those games') : '';
      return '<div class="panel pad"><span class="ga-tag '+cls+'">'+lab+'</span><b>'+t.t+'</b><div>'+t.d+'</div>'
        + '<div class="ga-dots">'+old.map(g=>{ const v=g.tr&&g.tr[t.key]; return '<span class="'+(v==='good'?'g':v==='bad'?'b':'n')+'" title="'+g.date+' vs '+g.short+': '+(v||'not a factor')+'"></span>'; }).join('')+'</div>'
        + '<div class="note">Good in '+good+', bad in '+bad+' of '+pl(N)+wl+'</div></div>'; }).join('')+'</div>';

  /* over time: the counter for every analyzed game, plus records when the Jazz win each battle */
  const BAT = [['Turnovers', g=>g.m.oto-g.m.to, 'fewer turnovers'],['Offensive rebounds', g=>g.m.oreb-g.m.ooreb, 'more offensive rebounds'],['Points off turnovers', g=>g.m.potf-g.m.opotf, 'more points off turnovers'],['Shot attempts', g=>g.m.fga-g.m.ofga, 'more shot attempts'],['3-point %', g=>g.m.p3[0]/g.m.p3[1]-g.m.op3[0]/g.m.op3[1], 'a better 3-point %']];
  h += '<h3 class="ga-h3">Over time</h3><div class="note">Positive numbers mean the Jazz won that battle. "Record" shows how the Jazz did in games where they won or lost each battle.</div>';
  h += '<div class="ga-2" style="margin-top:10px"><div class="panel scroll"><table><thead><tr><th class="l">Game</th><th>Result</th><th data-d="Opponent turnovers minus Jazz turnovers">TO</th><th data-d="Jazz offensive rebounds minus opponent’s">OREB</th><th data-d="Jazz points off turnovers minus opponent’s">Pts off TO</th><th data-d="Jazz shot attempts minus opponent’s">Shots</th><th>3P% (UTA–OPP)</th></tr></thead><tbody>'
    + GA_GAMES.map(g=>'<tr><td class="l">'+g.date.replace(/^\w+, /,'')+' '+(g.where==='Away'?'@ ':'vs ')+g.short+'</td><td>'+g.res+' '+g.us+'–'+g.them+'</td>'+BAT.slice(0,4).map(b=>{const v=b[1](g);return '<td class="'+(v>0?'ga-up':v<0?'ga-dn':'')+'">'+sg(v)+'</td>';}).join('')+'<td>'+Math.round(g.m.p3[0]/g.m.p3[1]*100)+'–'+Math.round(g.m.op3[0]/g.m.op3[1]*100)+'</td></tr>').join('')
    + (N>1?'<tr><td class="l"><b>Average</b></td><td></td>'+BAT.slice(0,4).map(b=>{const v=Math.round(GA_GAMES.reduce((s,g)=>s+b[1](g),0)/N*10)/10;return '<td><b>'+sg(v)+'</b></td>';}).join('')+'<td></td></tr>':'')
    + '</tbody></table></div>';
  h += '<div class="panel scroll"><table><thead><tr><th class="l">When the Jazz had…</th><th>Record</th><th>Games won the battle</th></tr></thead><tbody>'
    + BAT.map(b=>{ const won=GA_GAMES.filter(g=>b[1](g)>0); return '<tr><td class="l">'+b[2]+'</td><td>'+won.filter(g=>g.res==='W').length+'–'+won.filter(g=>g.res==='L').length+'</td><td>'+won.length+' of '+N+'</td></tr>'; }).join('')
    + '</tbody></table></div></div>';

  h += '<h3 class="ga-h3">Games <span class="note">newest first · click to open</span></h3>';
  h += GA_GAMES.map(g=>'<details class="ga panel" id="ga-'+g.gid+'"><summary><div class="ga-res'+(g.res==='L'?' l':'')+'">'+g.res+'</div><div><div class="ga-tt">'+(g.res==='W'?'Beat':'Lost to')+' the '+g.opp+', '+g.us+'–'+g.them+'</div><div class="note">'+g.date+' · '+g.where+' · Record '+g.after+'</div></div><div class="ga-chev" aria-hidden="true">›</div></summary><div class="ga-body">'
    + '<div class="ga-verdict">'+g.verdict+'<div class="note" style="margin-top:6px">'+g.ctx+'</div></div>'
    + '<div class="ga-2"><div class="ga-box"><h3>What went well</h3><ul>'+g.well.map(x=>'<li>'+x+'</li>').join('')+'</ul></div><div class="ga-box"><h3>What hurt</h3><ul>'+g.hurt.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></div>'
    + '<h4>Adjustments during the game</h4><div class="panel scroll"><table><thead><tr><th class="l">When</th><th class="l">Change</th><th class="l wrap">Effect</th></tr></thead><tbody>'+g.changes.map(c=>'<tr><td class="l">'+c[0]+'</td><td class="l"><b>'+c[1]+'</b></td><td class="wrap">'+c[2]+'</td></tr>').join('')+'</tbody></table></div>'
    + '<h4>Win probability through the game <span class="note">(in-game estimates)</span></h4><div class="panel pad">'+gaWP(g.wp)+'</div>'
    + '<div class="ga-2" style="margin-top:4px"><div><h4>Glass and turnover counter</h4><div class="panel scroll"><table><thead><tr><th class="l">Stat</th><th>Jazz</th><th>'+g.short+'</th><th>At half</th></tr></thead><tbody>'+g.counter.map(r=>'<tr><td class="l">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>').join('')+'</tbody></table></div></div>'
    + '<div><h4>By quarter</h4><div class="panel scroll"><table><thead><tr><th class="l"></th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>Final</th></tr></thead><tbody><tr><td class="l">Jazz</td>'+g.quarters.map(q=>'<td>'+q[0]+'</td>').join('')+'<td class="hl">'+g.us+'</td></tr><tr><td class="l">'+g.short+'</td>'+g.quarters.map(q=>'<td>'+q[1]+'</td>').join('')+'<td>'+g.them+'</td></tr></tbody></table></div></div></div>'
    + '<h4>Dice vs. height review</h4><div class="ga-2"><div class="ga-box"><h3><span class="ga-tag ga-dice">Dice</span>Luck stats</h3><div class="scroll"><table><thead><tr><th class="l">Stat</th><th>Half</th><th>Final</th><th class="l">Result</th></tr></thead><tbody>'+rv(g.dice)+'</tbody></table></div><div class="note" style="margin-top:8px">'+g.luck+'</div></div>'
    + '<div class="ga-box"><h3><span class="ga-tag ga-ht">Height</span>Repeatable stats</h3><div class="scroll"><table><thead><tr><th class="l">Stat</th><th>Half</th><th>Final</th><th class="l">Result</th></tr></thead><tbody>'+rv(g.height)+'</tbody></table></div></div></div>'
    + '<h4>Jazz players</h4>'+pt(g.players)+'<h4>'+g.short+' players</h4>'+pt(g.oppPlayers)
    + '<h4>Darryn Peterson watch</h4><p style="margin:0">'+g.peterson+'</p>'
    + '<div class="note" style="margin-top:14px">'+(g.src||'')+'</div>'
    + '</div></details>').join('');
  $('#games').innerHTML = h;
}
/* ---------- wiring ---------- */
function renderAll(){ renderTabs(); renderHero(); renderOverview(); renderPlayerPerf(); renderLineupPerf(); renderPvp(); renderModels(); renderGames(); }
const RENDER = {ro:renderRoster, tr:renderTrioTable};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-trio],[data-trall],[data-dash],[data-sched],[data-mdl],[data-ts],[data-ga]');
  if(!t) return;
  const d = t.dataset;
  if(d.trio){ state.lp = d.trio.split(','); renderLineupPerf(); $('#lpFilters').scrollIntoView({block:'start'}); }
  else if(d.trall){ state.trAll = !state.trAll; renderTrioTable(); }
  else if(d.sched){ state.schedAll = !state.schedAll; renderSchedule(); if(!state.schedAll) $('#ovSched').scrollIntoView({block:'start'}); }
  else if(d.dash){ state.dash = d.dash; hideTip(); renderTabs(); history.replaceState(null,'','#'+d.dash); const tb = $('#tabs'); if(tb.getBoundingClientRect().top < 0 || scrollY > tb.offsetTop) scrollTo({top: tb.offsetTop, behavior:'instant'}); }
  else if(d.mdl){ state.mdl = d.mdl; renderModels(); }
  else if(d.ga){ const el = $('#ga-'+d.ga); if(el){ el.open = true; el.scrollIntoView({block:'start'}); } }
  else if(d.ts){ const [id,k] = d.ts.split(':'), st = state.sort[id]; if(st.k===k) st.d *= -1; else { st.k = k; st.d = (k==='names'||k==='name'||k==='ab'||k==='num') ? 1 : -1; } hideTip(); RENDER[id](); }
});
document.addEventListener('change', e => {
  const s = e.target.closest('[data-sel]'); if(!s) return;
  const k = s.dataset.sel;
  if(k==='ppPlayer'){ state.ppPlayer = s.value; state.ppGame = null; renderPlayerPerf(); }
  else if(k==='ppGame'){ state.ppGame = s.value; renderPlayerPerf(); }
  else if(/^lp[012]$/.test(k)){ state.lp[+k[2]] = s.value; renderLineupPerf(); }
  else if(k==='lpGame'){ state.lpGame = s.value; renderLineupPerf(); }
  else if(k==='pvA' || k==='pvB'){ state[k] = s.value; state[k+'g'] = 'ALL'; renderPvp(); }
  else if(k==='pvAg' || k==='pvBg'){ state[k] = s.value; renderPvp(); }
});

const fTS = s => new Date(s).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'});
$('#asof').textContent = D.sample ? 'Sample data' : 'Last updated: '+(D.updatedAt ? fTS(D.updatedAt) : D.generated);
if(D.sample) $('#banner').innerHTML = '<div class="banner"><b>Sample data.</b> Every number and Jazz player name on this page is simulated so you can try each feature. Run <code>python fetch_jazz.py</code> on your computer to load the real seasons.</div>';
$('#foot').innerHTML = D.sample ? 'Simulated sample seasons for layout testing. Not real NBA results.' : 'Box scores and play-by-play from ESPN (regular season only); every rating, lineup, and model on this page is computed from them. Updated '+esc(D.updatedAt ? fTS(D.updatedAt) : D.generated)+'. Not affiliated with or endorsed by the NBA, ESPN, or the Utah Jazz.';
renderAll();
})();
