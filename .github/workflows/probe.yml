name: Probe NBA CDN (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Save ESPN samples
        shell: python
        run: |
          import json, urllib.request, os
          B = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba"
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=30) as r:
                  return json.loads(r.read())
          os.makedirs("samples", exist_ok=True)
          sb = get(B + "/scoreboard?dates=20261113"); json.dump(sb, open("samples/scoreboard_20261113.json", "w"))
          sch = get(B + "/teams/26/schedule"); json.dump(sch, open("samples/schedule_uta.json", "w"))
          done = [e for e in sch["events"] if e["competitions"][0]["status"]["type"]["completed"]]
          for e in done[-2:]:
              json.dump(get(B + "/summary?event=" + e["id"]), open("samples/summary_%s.json" % e["id"], "w"))
          other = [e for e in sb["events"] if all(c["team"]["abbreviation"] != "UTAH" for c in e["competitions"][0]["competitors"])][0]
          json.dump(get(B + "/summary?event=" + other["id"]), open("samples/summary_%s.json" % other["id"], "w"))
          json.dump(get(B + "/teams/26/roster"), open("samples/roster_uta.json", "w"))
          json.dump(get(B + "/teams/26/schedule?season=2026"), open("samples/schedule_uta_2026.json", "w"))
      - name: Push samples to a scratch branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -b probe-samples
          git add samples && git commit -qm "ESPN samples" && git push -f origin probe-samples
