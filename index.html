<title>Utah Jazz Dashboard</title>

<meta property="og:description" content="Utah Jazz team stats against the league, player stats, lineups, on/off, shot charts, and statistical models in one static page.">
<meta property="og:url" content="https://maximhoeft94.github.io/jazz-dashboard/">
<meta property="og:image" content="https://maximhoeft94.github.io/jazz-dashboard/screenshots/overview.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f0f7; --panel:#ffffff; --ink:#15112a; --muted:#625c78; --line:#dcd9e8; --soft:#f6f5fb;
  --jazz:#4b2a85; --good:#0b8a4f; --bad:#c8202f;
  --div:#4b2a85; --a:#4b2a85; --b:#e8590c;
  --hot:#d1495b; --cold:#3b6fb6; --mid:#e6e4ee;
  --font-d:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --font-b:'Barlow','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 56px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--div);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px}
.brand{font-family:var(--font-d);font-weight:700;font-size:20px;letter-spacing:.02em}
.brand small{font-family:var(--font-b);font-weight:500;font-size:13px;color:var(--muted);margin-left:8px;letter-spacing:0}
.banner{background:color-mix(in srgb,var(--b) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--b) 55%,var(--line));border-radius:6px;padding:10px 14px;margin-bottom:14px;font-size:14px}

/* tabs */
.tabs{display:flex;border-bottom:3px solid var(--jazz);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:5px solid transparent;margin-bottom:-3px;padding:10px 20px 8px;font-family:var(--font-d);font-weight:600;font-size:22px;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--b)}
.tab small{font-family:var(--font-b);font-size:13px;font-weight:500;margin-left:6px;color:var(--muted)}

/* hero */
.hero{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:30px 0 20px}
.mark{width:132px;height:132px;flex:none;margin-right:8px}
.mark .f{fill:none;stroke:var(--jazz);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.mark .b{fill:none;stroke:var(--jazz);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.mark .m{fill:none;stroke:var(--jazz);stroke-width:1.5;opacity:.4}
.hero h1{font-family:var(--font-d);font-weight:700;font-size:clamp(56px,10vw,104px);line-height:.88;margin:0;letter-spacing:-.005em}
.hero h1 span{display:block;font-size:.3em;font-weight:600;color:var(--muted);letter-spacing:.01em;margin-bottom:6px}
.hero .circle{position:relative}
.hero .circle::after{content:"";position:absolute;left:-14px;top:-4px;bottom:-4px;width:6px;background:var(--jazz);border-radius:3px}
.hero .circle h1{padding-left:12px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.kpi{padding:14px 16px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kl{font-size:13px;color:var(--muted)}
.kv{font-family:var(--font-d);font-weight:700;font-size:34px;line-height:1.05;margin-top:2px}
.ks{font-size:13px;color:var(--muted);margin-top:2px}
.rkb{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:0 6px;color:#fff;margin-left:4px;vertical-align:2px}

/* sections */
section{margin-top:34px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:10px}
h2{font-family:var(--font-d);font-weight:700;font-size:30px;line-height:1;margin:0}
.note{font-size:13px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.scroll{overflow-x:auto}
.pad{padding:14px 16px}

/* tables */
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{font-weight:600;font-size:13px;color:var(--muted);background:var(--soft);user-select:none}
th[data-ts]{cursor:pointer}
th[data-ts]:hover{color:var(--ink)}
th.on{color:var(--ink)}
th.on::after{content:attr(data-arrow);margin-left:3px;color:var(--div)}
tbody tr:last-child td{border-bottom:0}
td.hl{font-weight:700;background:color-mix(in srgb,var(--div) 9%,transparent)}
tr.me td{background:color-mix(in srgb,var(--jazz) 10%,transparent);font-weight:600}
tr.me td.hl{background:color-mix(in srgb,var(--jazz) 18%,transparent)}
tr.avg td{background:var(--soft);color:var(--muted);font-style:italic;border-top:2px solid var(--line)}
tr.dim td{color:var(--muted)}
.team{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.team .full{font-weight:500;color:var(--muted);font-size:13px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--line)}
.W{color:var(--good);font-weight:700}.L{color:var(--bad);font-weight:700}
.rk{color:var(--muted);width:30px}
.pos{color:var(--muted);font-size:12px;margin-left:6px;font-weight:500}

/* pills */
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
.pill.on{background:var(--div);border-color:var(--div);color:#fff}
.pills .sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.pills .lab{font-size:13px;color:var(--muted);margin-right:2px}

/* rows with bars */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g2>*,.shot>*,.h2h>*{min-width:0}
@media (max-width:820px){.g2{grid-template-columns:1fr}}
.card{padding:14px 16px 10px}
.card h3{font-family:var(--font-d);font-weight:600;font-size:21px;margin:0 0 8px}
.cr{display:grid;grid-template-columns:150px minmax(0,1fr) 62px;gap:8px;align-items:center;padding:4px 0;font-size:14px}
.cr .tm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr .v{text-align:right;font-weight:600}
.trk{height:14px;background:var(--soft);border-radius:3px;overflow:hidden;display:flex}
.trk i{display:block;height:100%}
.dv{display:grid;grid-template-columns:1fr 1fr;height:14px;background:var(--soft);border-radius:3px;overflow:hidden}
.dv .l{display:flex;justify-content:flex-end;border-right:2px solid var(--line)}
.dv .r{display:flex}
.dv i{display:block;height:100%}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 6px}
.lgd b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.lgd b.c{border-radius:50%}

/* strip plots (team vs league) */
.strip{position:relative;height:24px;min-width:200px}
.strip span{position:absolute;top:50%;transform:translate(-50%,-50%)}
.strip .ax{left:0!important;right:0;transform:translateY(-50%);height:1px;background:var(--line)}
.strip .o{width:7px;height:7px;border-radius:50%;background:#b9b4cc}
.strip .me{width:14px;height:14px;border-radius:50%;background:var(--jazz);box-shadow:0 0 0 2px var(--panel);z-index:1}
.strip .avg{width:0;height:20px;border-left:1.5px dashed var(--muted)}
table.vs td{padding:5px 10px}
table.vs td.st{width:42%;min-width:220px}
.better{font-size:11px;color:var(--muted)}

/* svg charts */
.sc{width:100%;height:auto;display:block}
.sc.xy{max-width:780px;margin:0 auto}
.sc text{font-family:var(--font-b);font-size:12px;fill:var(--muted)}
.sc .lab{fill:var(--ink);font-weight:600}
.sc .gl{stroke:var(--line);stroke-width:1}
.sc .ax{stroke:#bdb8cf;stroke-width:1.25}
.sc .avg{stroke:var(--muted);stroke-width:1.25;stroke-dasharray:5 4}
.sc .ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.sc .rpt{cursor:pointer}
.sc .rpt .hit{fill:transparent}
.sc .rpt .dotp{stroke:var(--panel);stroke-width:1.5;transition:stroke-width .1s}
.sc .rpt:hover .dotp{stroke:var(--ink);stroke-width:2.5}

/* shot chart */
.shot{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.shot{grid-template-columns:1fr}}
.court{width:100%;height:auto;display:block;max-width:600px;margin:0 auto}
.court .cl{fill:none;stroke:#b7b1cb;stroke-width:2}
.court .cl.d{stroke-dasharray:6 6}
.court .floor{fill:#fbfaf6}
.court .hx{stroke:var(--panel);stroke-width:.8}
.court .mk{fill:var(--good);opacity:.75}
.court .ms{fill:none;stroke:var(--bad);stroke-width:2;opacity:.6}
.court .rpt{cursor:pointer}
.court .rpt:hover .hx{stroke:var(--ink);stroke-width:2}
.scale{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);justify-content:center;margin-top:6px}
.scale .bar{width:160px;height:10px;border-radius:2px;background:linear-gradient(90deg,var(--cold),var(--mid),var(--hot))}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.mini div{padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.mini div:nth-child(3n){border-right:0}
.mini div:nth-last-child(-n+3){border-bottom:0}
.mini b{display:block;font-family:var(--font-d);font-size:24px;line-height:1.1}
.mini span{font-size:12px;color:var(--muted)}

/* selects */
.sel{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
select{font:inherit;font-size:14px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%;min-width:0;flex:1 1 180px}
.sel .ca{border-left:5px solid var(--a)}.sel .cb{border-left:5px solid var(--b)}

/* head to head */
.h2h{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.radar{width:100%;height:auto;display:block;max-width:520px;margin:0 auto}
.radar .ring{fill:none;stroke:var(--line);stroke-width:1}
.radar .spoke{stroke:var(--line);stroke-width:1}
.radar text{font-family:var(--font-b);font-size:13px;fill:var(--ink)}
.radar .rpt{cursor:pointer}
.radar .rpt .hit{fill:transparent}
.radar .rpt .dotp{stroke:var(--panel);stroke-width:2}
.radar .rpt:hover .dotp{stroke:var(--ink);stroke-width:2.5}
.cmp td{padding:6px 8px}
.cmp td.k{text-align:center;color:var(--muted);font-size:13px}
.cmp td.win{font-weight:700;color:var(--ink)}
.cmp td:not(.win):not(.k){color:var(--muted)}
.cmp .a.win{box-shadow:inset 3px 0 0 var(--a)}
.cmp .b.win{box-shadow:inset -3px 0 0 var(--b)}
.cmp td.a{text-align:right}.cmp td.b{text-align:left}

/* model */
.eq{font-size:14px;line-height:1.55;margin:0 0 10px}
.eq b{font-weight:600}
.callout{border-left:4px solid var(--jazz);background:var(--soft);padding:10px 14px;border-radius:0 6px 6px 0;margin-bottom:12px;font-size:14px}
.callout b{font-family:var(--font-d);font-size:22px;font-weight:700;margin-right:4px}

/* tooltip */
.tip{position:fixed;left:0;top:0;z-index:50;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--a);border-radius:6px;padding:7px 11px;font-size:13px;line-height:1.35;box-shadow:0 4px 14px rgba(21,17,42,.16);white-space:nowrap}
.tip.on{opacity:1}
.tip.wrap{white-space:normal;max-width:280px}
.tip span{display:block;color:var(--muted)}
.tip span b{color:var(--ink)}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:3px solid var(--jazz);padding-top:12px}

@media (max-width:820px){
  .hero{padding-top:22px}
  .mark{width:84px;height:84px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi{border-bottom:1px solid var(--line)}
  .kpi:nth-child(2n){border-right:0}
  .kpi:last-child{grid-column:1/-1;border-bottom:0;border-right:0}
  .h2h{grid-template-columns:1fr}
  .cr{grid-template-columns:110px minmax(0,1fr) 56px}
}
@media (prefers-reduced-motion:no-preference){ .trk i{transition:width .35s ease} }
</style>
</head>

</div>

          + '<td class="num">'+(r?(dir===0?ord(r):rkBadge(r,n,dir)):'–')+'</td><td class="st">'+strip(X.teams,k,dir===0?1:dir,J,avg)+'</td></tr>';
      });
    });
    h += '</tbody></table></div>';
  } else if(state.ins==='log'){
    h += gameLog(X);
  } else if(state.ins==='ff'){
    h += fourFactors(X);
  } else {
    h += splits(X);
  }
  $('#vsLeague').innerHTML = h;
}
function gameLog(X){
  const G = X.games.filter(g => ok(g.margin));
  if(!G.length) return '<div class="panel empty">No games played yet.</div>';
  const W = 760, H = 300, ml = 40, mr = 14, mt = 16, mb = 34;
  const mx = Math.max(10, Math.max.apply(null, G.map(g=>Math.abs(g.margin))));
  const top = Math.ceil(mx/10)*10, bw = (W-ml-mr)/G.length;
  const Y = v => mt + (top - v)/(2*top)*(H-mt-mb);
  let s = '<svg class="sc" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Point margin by game">';
  for(let v=-top; v<=top; v+=top/2){ s += '<line class="gl" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(ml-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+(v>0?'+':'')+v+'</text>'; }
  s += '<line class="ax" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(0)+'" y2="'+Y(0)+'"/>';
  G.forEach((g,i) => {
    const x = ml + i*bw + bw*0.12, w = Math.max(1.5, bw*0.76), y0 = Y(Math.max(0,g.margin)), hgt = Math.abs(Y(g.margin)-Y(0));
    s += '<g class="rpt" data-n="'+esc(g.d+' '+(g.home?'vs':'@')+' '+g.opp)+'" data-c="'+(g.margin>0?'var(--good)':'var(--bad)')+'" data-l="Result::'+g.res+' '+g.pts+'-'+g.opts+'||Margin::'+sgn(g.margin,0)+'||Game::'+g.n+'"><rect class="hit" x="'+(ml+i*bw)+'" y="'+mt+'" width="'+bw+'" height="'+(H-mt-mb)+'"/><rect class="dotp" x="'+x.toFixed(1)+'" y="'+y0.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(1,hgt).toFixed(1)+'" fill="'+(g.margin>0?'var(--good)':'var(--bad)')+'" opacity=".8" style="stroke-width:0"/></g>';
  });
  const win = Math.min(10, Math.max(3, Math.round(G.length/6)));
  if(G.length >= win){
    let pts = []; for(let i=win-1;i<G.length;i++){ const m = mean(G.slice(i-win+1,i+1).map(g=>g.margin)); pts.push((ml+i*bw+bw/2).toFixed(1)+','+Y(m).toFixed(1)); }
    s += '<polyline class="ln" points="'+pts.join(' ')+'" stroke="var(--jazz)"/>';
  }
  const step = Math.max(1, Math.round(G.length/10));
  G.forEach((g,i) => { if(i%step===0) s += '<text x="'+(ml+i*bw+bw/2)+'" y="'+(H-mb+16)+'" text-anchor="middle">'+g.n+'</text>'; });
  s += '<text x="'+((W)/2)+'" y="'+(H-4)+'" text-anchor="middle">Game number</text></svg>';
  const last = G.slice(-10).reverse();
  let t = '<table><thead><tr><th class="l">Date</th><th class="l">Opponent</th><th>Result</th><th>Score</th><th>Margin</th></tr></thead><tbody>'
    + last.map(g => '<tr><td class="l">'+esc(g.d)+'</td><td class="l">'+(g.home?'vs':'@')+' '+esc(g.opp)+'</td><td class="'+g.res+'">'+g.res+'</td><td class="num">'+g.pts+'-'+g.opts+'</td><td class="num">'+sgn(g.margin,0)+'</td></tr>').join('')+'</tbody></table>';
  const L10 = G.slice(-10), w10 = L10.filter(g=>g.res==='W').length;
  return '<div class="g2"><div class="panel card" style="grid-column:1/-1"><h3>Point margin, game by game</h3><div class="lgd"><span><b style="background:var(--good)"></b>Win</span><span><b style="background:var(--bad)"></b>Loss</span><span><b style="background:var(--jazz);height:3px;vertical-align:3px"></b>'+win+'-game rolling average</span></div>'+s+'</div>'
    + '<div class="panel scroll" style="grid-column:1/-1"><div class="pad" style="padding-bottom:4px"><h3 style="font-family:var(--font-d);font-weight:600;font-size:21px;margin:0">Last '+L10.length+' games: '+w10+'-'+(L10.length-w10)+'</h3></div>'+t+'</div></div>';
}
function fourFactors(X){
  const J = X.J, avg = k => mean(X.teams.map(t=>t[k])), n = X.teams.length;
  const F = [['Offense',[['efg','Shooting (eFG %)',1],['tovp','Turnovers (TOV %)',-1],['orebp','Offensive rebounding (OREB %)',1],['ftr','Free throws (FTA per FGA)',1]]],
             ['Defense',[['oefg','Opponent shooting (eFG %)',-1],['otovp','Forced turnovers (TOV %)',1],['oorebp','Opponent offensive rebounding',-1],['oftr','Opponent free throws (FTA per FGA)',-1]]]];
  let h = '<div class="note" style="margin:-2px 0 8px">Dean Oliver\'s four factors explain most of the gap between winning and losing teams. Bars show how far the Jazz are from league average, in the better (green) or worse (red) direction.</div><div class="g2">';
  F.forEach(([side, rows]) => {
    h += '<div class="panel card"><h3>'+side+'</h3>';
    rows.forEach(([k,lab,dir]) => {
      const a = avg(k), sd = Math.sqrt(mean(X.teams.map(t=>Math.pow(t[k]-a,2)))) || 1, z = ok(J[k]) ? (J[k]-a)/sd*dir : 0;
      const w = Math.min(100, Math.abs(z)/2.5*100).toFixed(1), r = rankOf(X.teams,k,dir,J.ab), isF = k==='ftr'||k==='oftr';
      h += '<div class="cr"><span class="tm" title="'+esc(lab)+'">'+esc(lab)+'</span><span class="dv rpt" data-n="'+esc(lab)+'" data-c="var(--jazz)" data-l="Jazz::'+(isF?p3(J[k]):num(J[k],1))+'||League average::'+(isF?p3(a):num(a,1))+'||Rank::'+(r?ord(r)+' of '+n:'–')+'"><span class="l">'+(z<0?'<i style="width:'+w+'%;background:var(--bad)"></i>':'')+'</span><span class="r">'+(z>0?'<i style="width:'+w+'%;background:var(--good)"></i>':'')+'</span></span><span class="v num">'+(isF?p3(J[k]):num(J[k],1))+'</span></div>';
    });
    h += '<div class="note" style="margin-top:6px">Bar length: standard deviations from the league average (full bar = 2.5).</div></div>';
  });
  return h + '</div>';
}
function splits(X){
  const G = X.games.filter(g => ok(g.margin));
  if(!G.length) return '<div class="panel empty">No games played yet.</div>';
  const rec = L => { const w = L.filter(g=>g.res==='W').length; return {w, l:L.length-w, m: mean(L.map(g=>g.margin)), n:L.length}; };
  const over = ab => { const t = X.byAb[ab]; return t && ok(t.wpct) && t.wpct >= .5; };
  const rows = [['Home', G.filter(g=>g.home)], ['Road', G.filter(g=>!g.home)], ['vs. teams .500 or better', G.filter(g=>over(g.opp))], ['vs. teams below .500', G.filter(g=>!over(g.opp))],
    ['Close games (5 points or fewer)', G.filter(g=>Math.abs(g.margin)<=5)], ['Blowouts (15+ points)', G.filter(g=>Math.abs(g.margin)>=15)]];
  const months = {}; G.forEach(g => { const k = g.d.slice(0,7); (months[k] = months[k] || []).push(g); });
  const mName = k => new Date(+k.slice(0,4), +k.slice(5,7)-1, 1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const tbl = (title, list) => '<div class="panel scroll"><div class="pad" style="padding-bottom:4px"><h3 style="font-family:var(--font-d);font-weight:600;font-size:21px;margin:0">'+title+'</h3></div><table><thead><tr><th class="l">Split</th><th>GP</th><th>Record</th><th>Win %</th><th>Avg margin</th></tr></thead><tbody>'
    + list.map(([l,L]) => { const r = rec(L); return '<tr><td class="l">'+esc(l)+'</td><td class="num">'+r.n+'</td><td class="num">'+r.w+'-'+r.l+'</td><td class="num">'+(r.n?p3(r.w/r.n):'–')+'</td><td class="num '+(r.m>0?'W':r.m<0?'L':'')+'">'+sgn(r.m)+'</td></tr>'; }).join('') + '</tbody></table></div>';
  return '<div class="g2">'+tbl('Situational', rows)+tbl('By month', Object.keys(months).sort().map(k => [mName(k), months[k]]))+'</div>';
}

/* ---------- generic sortable table ---------- */
function sortRows(rows, id, cols){
  const st = state.sort[id], c = cols.find(x=>x.k===st.k) || cols[0], val = c.sv || (r => r[c.k]);
  return rows.slice().sort((a,b) => {
    const x = val(a), y = val(b);
    if(typeof x==='string' || typeof y==='string') return String(x).localeCompare(String(y))*st.d*-1;
    if(!ok(x) && !ok(y)) return 0; if(!ok(x)) return 1; if(!ok(y)) return -1;
    return (y-x)*-st.d;
  });
}
function thead(id, cols, extra){
  const st = state.sort[id];
  return '<thead><tr>'+(extra||'')+cols.map(c => { const on = st.k===c.k;
    return '<th class="'+(c.l?'l':'')+(on?' on':'')+'" data-ts="'+id+':'+c.k+'"'+(c.d?' data-d="'+esc(c.d)+'"':'')+(on?' data-arrow="'+(st.d===-1?'▼':'▲')+'"':'')+'>'+c.t+'</th>'; }).join('')+'</tr></thead>';
}
function cell(c, r, id){
  const on = state.sort[id].k===c.k;
  return '<td class="'+(c.l?'l':'num')+(on?' hl':'')+'">'+(c.f ? c.f(r) : esc(r[c.k]))+'</td>';
}

function hexbin(points, r){

    }
    const id = pi+'|'+pj, b = bins[id] || (bins[id] = {x:(pi + (pj & 1)/2)*dx, y:pj*dy, n:0, m:0, e:0, en:0});
    b.n++; b.m += p.m; if(ok(p.e)){ b.e += p.e; b.en++; }
  });

}

/* ---------- statistical models ---------- */
function solve(A, b){ // Gaussian elimination with partial pivoting
  const n = b.length, M = A.map((r,i) => r.concat([b[i]]));
  for(let c=0;c<n;c++){
    let p = c; for(let r=c+1;r<n;r++) if(Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]]; if(Math.abs(M[c][c]) < 1e-12) continue;
    for(let r=0;r<n;r++) if(r!==c){ const f = M[r][c]/M[c][c]; for(let k=c;k<=n;k++) M[r][k] -= f*M[c][k]; }
  }
  return M.map((r,i) => Math.abs(r[i])<1e-12 ? 0 : r[n]/r[i]);
}
function wls(Xr, y, w, ridge, skip0){ // weighted (ridge) least squares; ridge not applied to column 0 when skip0
  const k = Xr[0].length, A = Array.from({length:k}, () => new Array(k).fill(0)), b = new Array(k).fill(0);
  Xr.forEach((x,i) => { for(let a=0;a<k;a++){ b[a] += w[i]*x[a]*y[i]; for(let c=0;c<k;c++) A[a][c] += w[i]*x[a]*x[c]; } });
  for(let a=(skip0?1:0); a<k; a++) A[a][a] += ridge;
  return solve(A, b);
}
const MDL = [['pyth','Expected wins'],['shotq','Shot quality vs. shot making'],['impact','Lineup impact (ridge)'],['ffreg','Four-factor model']];

function mPyth(X){
  const EXP = 14, T = X.teams.filter(t => t.gp>0 && ok(t.opp)).map(t => { const e = Math.pow(t.pts,EXP)/(Math.pow(t.pts,EXP)+Math.pow(t.opp,EXP)); return Object.assign({}, t, {xw:e}); });

  const P = T.map(t => ({x:t.xw, y:t.wpct, me:t.ab===D.team.ab, c:t.ab===D.team.ab?'var(--jazz)':null, n:t.ab, lab:t.ab===D.team.ab?'UTA':'', l:'Actual::'+t.w+'-'+t.l+' ('+p3(t.wpct)+')||Expected::'+p3(t.xw)+' ('+(t.xw*t.gp).toFixed(1)+' wins)||Luck::'+sgn(t.w-t.xw*t.gp,1)+' wins'}));
  return '<div class="callout"><b>'+xW.toFixed(1)+'-'+(J.gp-xW).toFixed(1)+'</b> expected record from points scored and allowed, vs. an actual '+J.w+'-'+J.l+'. The Jazz have won <b style="font-size:inherit">'+Math.abs(luck).toFixed(1)+'</b> '+(luck>=0?'more':'fewer')+' games than their margin predicts'+(rem>0?'; at this rate they finish near '+Math.round(J.w + J.xw*rem)+' wins.':'.')+'</div>'

    + '<div class="panel card">'+scatterXY(P,{title:'Actual vs expected win %',diag:1,xl:'Expected win % (from point margin)',yl:'Actual win %',fx:v=>p3(v),fy:v=>p3(v)})+'</div>';
}
function mShotQ(X){
  const by = {}; X.shots.forEach(s => { if(!ok(s.e)) return; const b = by[s.p] || (by[s.p] = {n:0,pts:0,xp:0,m3:0,m:0,xe:0}); b.n++; b.pts += s.m*s.v; b.xp += s.e*s.v; b.m += s.m; if(s.v===3) b.m3 += s.m; b.xe += s.e*(s.v===3?1.5:1); });
  const minN = Math.max(25, Math.round(X.shots.length/60));
  const R = Object.keys(by).map(Number).filter(p => by[p].n >= minN).map(p => { const b = by[p]; return {p, name:X.name(p), n:b.n, xefg:100*b.xe/b.n, efg:100*(b.m+0.5*b.m3)/b.n, over:100*(b.pts-b.xp)/b.n}; });
  if(!R.length) return '<div class="panel empty">Not enough shots yet.</div>';
  const P = R.map(r => ({x:r.xefg, y:r.efg, n:r.name, lab:short(r.name), c:r.over>=0?'var(--good)':'var(--bad)', r:4+10*Math.sqrt(r.n/Math.max.apply(null,R.map(q=>q.n))), fo:.7, l:'Shots::'+r.n+'||Expected eFG%::'+num(r.xefg,1)+'||Actual eFG%::'+num(r.efg,1)+'||Points per 100 shots vs. expected::'+sgn(r.over,1)}));
  const S2 = R.slice().sort((a,b)=>b.over-a.over), mx = Math.max(3, Math.max.apply(null,S2.map(r=>Math.abs(r.over))));
  return '<p class="eq">Each shot gets an <b>expected value</b>: the league\'s FG% from that exact zone, times 2 or 3. Summed over a player\'s shots, that measures <b>shot quality</b> (where he shoots from). Actual points minus expected points measures <b>shot making</b> (how well he converts). Minimum '+minN+' attempts.</p>'
    + '<div class="g2"><div class="panel card"><h3>Shot quality vs. results</h3><div class="lgd"><span>Right: better shot locations. Up: better results. Above the dashed line: making more than expected.</span></div>'+scatterXY(P,{title:'Expected vs actual eFG%',diag:1,xl:'Expected eFG% (shot quality)',yl:'Actual eFG%'})+'</div>'
    + '<div class="panel card"><h3>Shot making, points per 100 shots vs. expected</h3>'+S2.map(r => { const w = (Math.abs(r.over)/mx*100).toFixed(1);
      return '<div class="cr"><span class="tm">'+esc(r.name)+'</span><span class="dv"><span class="l">'+(r.over<0?'<i style="width:'+w+'%;background:var(--bad)"></i>':'')+'</span><span class="r">'+(r.over>0?'<i style="width:'+w+'%;background:var(--good)"></i>':'')+'</span></span><span class="v num">'+sgn(r.over,1)+'</span></div>'; }).join('')
    + '<div class="note" style="margin-top:6px">Shooting luck evens out: over a few hundred shots, gaps of ±10 are common noise.</div></div></div>';
}
function mImpact(X){
  const L = (X.raw.lineups['5']||[]).filter(l => ok(l.net) && (l.poss||0) > 0);
  if(L.length < 6) return '<div class="panel empty">Not enough 5-man lineup data yet.</div>';
  const ids = [...new Set(L.flatMap(l=>l.ids))], ix = {}; ids.forEach((p,i)=>ix[p]=i);
  const w = L.map(l=>l.poss), wsum = w.reduce((a,b)=>a+b,0), base = L.reduce((a,l)=>a+l.net*l.poss,0)/wsum;
  const Xr = L.map(l => { const r = new Array(ids.length).fill(0); l.ids.forEach(p => r[ix[p]] = 1); return r; });
  const LAMBDA = Math.max(200, wsum/8);
  const beta = wls(Xr, L.map(l=>l.net-base), w, LAMBDA, false);
  const poss = ids.map(p => L.filter(l=>l.ids.includes(p)).reduce((a,l)=>a+l.poss,0));
  const R = ids.map((p,i) => ({name:X.name(p), b:beta[i], poss:poss[i]})).sort((a,b)=>b.b-a.b), mx = Math.max(2, Math.max.apply(null,R.map(r=>Math.abs(r.b))));
  return '<p class="eq">A small version of <b>regularized adjusted plus-minus (RAPM)</b>. Each 5-man lineup\'s net rating (relative to the Jazz average of '+sgn(base)+') is modeled as the sum of its five players\' effects, weighted by possessions. A ridge penalty (λ = '+Math.round(LAMBDA)+' possessions) shrinks players with little data toward zero. This separates a player from the teammates he plays with, which raw on/off cannot do.</p>'
    + '<div class="panel card"><h3>Estimated effect on Jazz net rating, per 100 possessions</h3>'+R.map(r => { const wd = (Math.abs(r.b)/mx*100).toFixed(1);
      return '<div class="cr"><span class="tm">'+esc(r.name)+'</span><span class="dv rpt" data-n="'+esc(r.name)+'" data-c="var(--jazz)" data-l="Effect::'+sgn(r.b,1)+' per 100||Lineup possessions::'+r.poss+'"><span class="l">'+(r.b<0?'<i style="width:'+wd+'%;background:var(--bad)"></i>':'')+'</span><span class="r">'+(r.b>0?'<i style="width:'+wd+'%;background:var(--good)"></i>':'')+'</span></span><span class="v num">'+sgn(r.b,1)+'</span></div>'; }).join('')
    + '<div class="note" style="margin-top:6px">Only the Jazz\'s own lineups are used, so effects are relative to teammates, not the league. One season of lineup data is noisy; treat gaps under ±2 as a tie.</div></div>';
}
function mFF(){
  // Pool every loaded season: net rating ~ eFG diff + TOV diff + OREB diff + FT-rate diff
  const rows = [];
  D.order.forEach(s => (D.seasons[s].teams||[]).forEach(t => { if(t.gp>0 && [t.efg,t.oefg,t.tovp,t.otovp,t.orebp,t.oorebp,t.ftr,t.oftr,t.net].every(ok))
    rows.push({s, ab:t.ab, x:[1, t.efg-t.oefg, t.tovp-t.otovp, t.orebp-t.oorebp, 100*(t.ftr-t.oftr)], y:t.net, gp:t.gp}); }));
  if(rows.length < 12) return '<div class="panel empty">Not enough team data yet.</div>';
  const beta = wls(rows.map(r=>r.x), rows.map(r=>r.y), rows.map(r=>r.gp), 0, true);
  const pred = rows.map(r => r.x.reduce((a,v,i)=>a+v*beta[i],0)), ym = mean(rows.map(r=>r.y));
  const r2 = 1 - rows.reduce((a,r,i)=>a+Math.pow(r.y-pred[i],2),0)/rows.reduce((a,r)=>a+Math.pow(r.y-ym,2),0);
  const X = S(), me = rows.find(r => r.s===state.season && r.ab===D.team.ab);
  const cur = rows.filter(r => r.s===state.season), avgx = [1,2,3,4].map(i => mean(cur.map(r=>r.x[i])));
  const names = ['Shooting','Turnovers','Rebounding','Free throws'];
  let h = '<p class="eq">A weighted regression across every team-season loaded ('+rows.length+' rows, R² = '+r2.toFixed(2)+') estimates how much each factor margin is worth in net rating:</p>'
    + '<div class="callout" style="font-size:14px">Net rating ≈ '+beta[0].toFixed(2)+' + <b style="font-size:inherit">'+beta[1].toFixed(2)+'</b> × eFG margin '+(beta[2]>=0?'+ ':'− ')+'<b style="font-size:inherit">'+Math.abs(beta[2]).toFixed(2)+'</b> × TOV margin + <b style="font-size:inherit">'+beta[3].toFixed(2)+'</b> × OREB margin + <b style="font-size:inherit">'+beta[4].toFixed(2)+'</b> × FT-rate margin<br><span class="note">Margins are the team\'s number minus its opponents\'. A TOV margin above zero means more giveaways than takeaways.</span></div>';
  if(!me) return h + '<div class="panel empty">The Jazz have no data for this season yet.</div>';
  const contrib = [1,2,3,4].map(i => beta[i]*(me.x[i]-avgx[i-1])), predJ = me.x.reduce((a,v,i)=>a+v*beta[i],0), mx = Math.max(2, Math.max.apply(null,contrib.map(Math.abs)));
  h += '<div class="panel card"><h3>Where the Jazz gain and lose net rating vs. an average team, '+esc(state.season)+'</h3>'
    + contrib.map((c,i) => { const w = (Math.abs(c)/mx*100).toFixed(1); return '<div class="cr"><span class="tm" title="'+esc(names[i])+'">'+esc(names[i])+'</span><span class="dv"><span class="l">'+(c<0?'<i style="width:'+w+'%;background:var(--bad)"></i>':'')+'</span><span class="r">'+(c>0?'<i style="width:'+w+'%;background:var(--good)"></i>':'')+'</span></span><span class="v num">'+sgn(c,1)+'</span></div>'; }).join('')
    + '<div class="note" style="margin-top:8px">Model-predicted net rating '+sgn(predJ)+' vs. actual '+sgn(X.J.net)+'. The gap is what the four factors do not explain (shot timing, transition, luck).</div></div>';
  return h;
}

/* ---------- head to head ---------- */
const RAD = [['p36','Points',1,1],['r36','Rebounds',1,1],['a36','Assists',1,1],['stk36','Steals + blocks',1,1],['t36','Turnovers (fewer)',-1,1],['ts','True shooting %',1,1],['usg','Usage %',1,1],['net','On-court net rating',1,1]];
function renderH2H(){
  const X = S();
  const minMin = Math.max(60, X.J.gp*10), pool = X.league.filter(p => (p.min||0) >= minMin);
  let h = '<div class="sh"><h2>Player vs. player</h2><span class="note">Percentiles among '+pool.length+' NBA players with '+minMin+'+ minutes. Per-36 stats unless marked.</span></div>';
  const jz = X.jazz.filter(p => (p.min||0) > 0).sort((a,b)=>b.min-a.min);
  if(jz.length < 1 || pool.length < 10){ $('#h2h').innerHTML = h + '<div class="panel empty">Not enough minutes played yet for percentiles.</div>'; return; }
  const all = {}; X.league.forEach(p => all[p.id] = p); jz.forEach(p => all[p.id] = p);
  if(!all[state.pA]) state.pA = jz[0].id;
  if(!all[state.pB] || String(state.pB)===String(state.pA)) state.pB = (jz[1]||pool[0]).id;
  const A = all[state.pA], B = all[state.pB];
  const sorted = {}; RAD.forEach(([k]) => sorted[k] = pool.map(p=>p[k]).filter(ok).sort((a,b)=>a-b));
  const pctl = (k,v,dir) => { const s = sorted[k]; if(!ok(v)||!s.length) return 0; let lo=0, hi=s.length; while(lo<hi){ const m=(lo+hi)>>1; if(s[m] <= v) lo=m+1; else hi=m; } const f = lo/s.length; return 100*(dir===-1 ? 1-f : f); };
  const pa = RAD.map(([k,,dir]) => pctl(k,A[k],dir)), pb = RAD.map(([k,,dir]) => pctl(k,B[k],dir));
  const cx = 260, cy = 230, R = 165, N = RAD.length, ang = i => -Math.PI/2 + i*2*Math.PI/N, pt = (i,v) => [cx + Math.cos(ang(i))*R*v/100, cy + Math.sin(ang(i))*R*v/100];
  let s = '<svg class="radar" viewBox="0 0 520 470" role="img" aria-label="Percentile radar">';
  [25,50,75,100].forEach(v => s += '<polygon class="ring" points="'+RAD.map((_,i)=>pt(i,v).map(n=>n.toFixed(1)).join(',')).join(' ')+'"/>');
  RAD.forEach((r,i) => { const [x,y] = pt(i,100), [lx,ly] = pt(i,118); s += '<line class="spoke" x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'"/><text x="'+lx.toFixed(1)+'" y="'+(ly+4).toFixed(1)+'" text-anchor="'+(Math.abs(lx-cx)<10?'middle':lx>cx?'start':'end')+'">'+esc(r[1])+'</text>'; });
  [[B,pb,'var(--b)'],[A,pa,'var(--a)']].forEach(([P,pp,c]) => {
    s += '<polygon points="'+pp.map((v,i)=>pt(i,Math.max(3,v)).map(n=>n.toFixed(1)).join(',')).join(' ')+'" fill="'+c+'" fill-opacity=".16" stroke="'+c+'" stroke-width="2.5" stroke-linejoin="round"/>';
    pp.forEach((v,i) => { const [x,y] = pt(i,Math.max(3,v)), k = RAD[i][0], isP = k==='ts'||k==='usg';
      s += '<g class="rpt" data-n="'+esc(P.name)+'" data-c="'+c+'" data-l="'+esc(RAD[i][1])+'::'+(k==='net'?sgn(P[k]):num(P[k],1))+(isP?'%':'')+'||Percentile::'+Math.round(v)+'"><circle class="hit" cx="'+x+'" cy="'+y+'" r="10"/><circle class="dotp" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="5" fill="'+c+'"/></g>'; });
  });
  s += '</svg>';
  const optsJ = jz.map(p => '<option value="'+p.id+'">'+esc(p.name)+'</option>').join('');
  const optsL = X.league.filter(p => p.team!==D.team.ab && (p.min||0) >= minMin).sort((a,b)=>a.name.localeCompare(b.name)).map(p => '<option value="'+p.id+'">'+esc(p.name)+' ('+esc(p.team)+')</option>').join('');
  const mk = (k, v) => '<select class="'+(k==='pA'?'ca':'cb')+'" data-sel="'+k+'" aria-label="'+(k==='pA'?'First':'Second')+' player">'+(k==='pA'?optsJ:'<optgroup label="Jazz">'+optsJ+'</optgroup><optgroup label="Rest of the league">'+optsL+'</optgroup>').replace('value="'+v+'"','value="'+v+'" selected')+'</select>';
  const rows = [['gp','Games',0],['mpg','Minutes per game',1],['ppg','Points per game',1]].concat(RAD.map(r=>[r[0],r[1]+(r[0].endsWith('36')?' per 36':''),r[2]===-1?-1:1]));
  const cmp = '<table class="cmp"><tbody>'+rows.map(([k,lab,dir]) => { const a = A[k], b = B[k], aw = dir && ok(a)&&ok(b) ? (dir===-1 ? a<b : a>b) : false, bw = dir && ok(a)&&ok(b) ? (dir===-1 ? b<a : b>a) : false, f = v => k==='net'?sgn(v):k==='gp'?v:num(v,1);
    return '<tr><td class="a num'+(aw?' win':'')+'">'+f(a)+'</td><td class="k">'+esc(lab)+'</td><td class="b num'+(bw?' win':'')+'">'+f(b)+'</td></tr>'; }).join('')+'</tbody></table>';
  h += '<div class="h2h"><div class="panel pad"><div class="sel">'+mk('pA',state.pA)+mk('pB',state.pB)+'</div>'+s+'</div><div class="panel pad"><div class="lgd"><span><b style="background:var(--a)"></b>'+esc(A.name)+'</span><span><b style="background:var(--b)"></b>'+esc(B.name)+(B.team!==D.team.ab?' ('+esc(B.team)+')':'')+'</span></div>'+cmp+'</div></div>';
  $('#h2h').innerHTML = h;
}

/* ---------- tooltip ---------- */
const tip = document.createElement('div'); tip.className = 'tip'; tip.setAttribute('role','tooltip'); document.body.appendChild(tip);
function moveTip(x,y){ const r = tip.getBoundingClientRect(); let L = x+14, Tp = y-r.height-12;
  if(L+r.width > innerWidth-8) L = x-r.width-14; if(Tp < 8) Tp = y+18; tip.style.left = L+'px'; tip.style.top = Tp+'px'; }
let tipFor = null;
const TIPSEL = '.rpt, th[data-d]';
function tipContent(g){
  if(g.classList.contains('rpt')){
    const lines = (g.dataset.l||'').split('||').filter(Boolean).map(x => x.split('::'));
    return {html:'<b>'+esc(g.dataset.n)+'</b>'+lines.map(l => '<span>'+esc(l[0])+': <b>'+esc(l[1])+'</b></span>').join(''), c:g.dataset.c, wrap:false};
  }
  return {html:'<b>'+esc(g.textContent.replace(/[▲▼]/g,''))+'</b><span>'+esc(g.dataset.d)+'</span>', c:'var(--div)', wrap:true};
}
function hideTip(){ tip.classList.remove('on'); tipFor = null; }
function showTip(g, e){
  if(tipFor !== g){ const t = tipContent(g); tipFor = g; tip.innerHTML = t.html; tip.style.borderLeftColor = t.c; tip.classList.toggle('wrap', t.wrap); }
  tip.classList.add('on'); moveTip(e.clientX, e.clientY);
}
document.addEventListener('pointerover', e => { const g = e.target.closest && e.target.closest(TIPSEL); if(g) showTip(g, e); });
document.addEventListener('pointermove', e => { const g = e.target.closest && e.target.closest(TIPSEL); if(g) showTip(g, e); });
document.addEventListener('pointerout', e => { const g = e.target.closest && e.target.closest(TIPSEL); if(g && !(e.relatedTarget && g.contains(e.relatedTarget))) hideTip(); });
addEventListener('scroll', hideTip, {passive:true});

/* ---------- wiring ---------- */
function renderAll(){ renderTabs(); renderHero(); renderVsLeague(); renderLeagueTable(); renderPlayers(); renderLineups(); renderOnOff(); renderShots(); renderModels(); renderH2H(); }
const RENDER = {lt:renderLeagueTable, pl:renderPlayers, lu:renderLineups};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-season],[data-ins],[data-lt],[data-pm],[data-lu],[data-lumin],[data-sc],[data-mdl],[data-ts]');
  if(!t) return;
  const d = t.dataset;
  if(d.season){ state.season = d.season; state.luMin = null; state.scP = 'ALL'; state.pA = state.pB = null; renderAll(); }
  else if(d.ins){ state.ins = d.ins; renderVsLeague(); }
  else if(d.lt){ state.lt = d.lt; renderLeagueTable(); }
  else if(d.pm){ state.pm = d.pm; renderPlayers(); }
  else if(d.lu){ state.lu = d.lu; state.luMin = null; renderLineups(); }
  else if(d.lumin!=null){ state.luMin = +d.lumin; renderLineups(); }
  else if(d.sc){ state.scMode = d.sc; renderShots(); }
  else if(d.mdl){ state.mdl = d.mdl; renderModels(); }
  else if(d.ts){ const [id,k] = d.ts.split(':'), st = state.sort[id]; if(st.k===k) st.d *= -1; else { st.k = k; st.d = (k==='names'||k==='name'||k==='ab') ? 1 : -1; } hideTip(); RENDER[id](); }
});
document.addEventListener('change', e => {
  const s = e.target.closest('[data-sel]'); if(!s) return;
  const k = s.dataset.sel;
  if(k==='scP'){ state.scP = s.value; renderShots(); }
  else { state[k] = s.value; if(String(state.pA)===String(state.pB)){ const X = S(), o = X.jazz.find(p => String(p.id)!==String(state.pA)); if(o) state[k==='pA'?'pB':'pA'] = String(o.id); } renderH2H(); }
});

const fTS = s => new Date(s).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'});
$('#asof').textContent = (D.sample ? 'Sample data' : 'Updated '+(D.updatedAt ? fTS(D.updatedAt) : D.generated));
if(D.sample) $('#banner').innerHTML = '<div class="banner"><b>Sample data.</b> Every number and Jazz player name on this page is simulated so you can try each feature. Run <code>python fetch_jazz.py</code> on your computer to load the real seasons.</div>';
$('#foot').innerHTML = D.sample ? 'Simulated sample seasons for layout testing. Not real NBA results.' : 'Box scores and play-by-play from ESPN (regular season only); every rating, lineup, and model on this page is computed from them. Updated '+esc(D.updatedAt ? fTS(D.updatedAt) : D.generated)+'. Not affiliated with or endorsed by the NBA, ESPN, or the Utah Jazz.';
renderAll();
})();
</script>
