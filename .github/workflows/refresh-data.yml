name: Refresh Jazz data

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours; commits only when a new game has finished
  workflow_dispatch:          # "Run workflow" button on the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Per-game records, so each run only downloads games finished since the last one
      - uses: actions/cache@v4
        with:
          path: games_cache.json
          key: games-${{ github.run_id }}
          restore-keys: games-

      - name: Pull the seasons from ESPN
        run: python fetch_jazz.py

      - name: Commit if the data changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html jazz_cache.json
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh Jazz data ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed; the site will update on the next build."
