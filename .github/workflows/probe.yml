name: Probe NBA CDN (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        shell: python
        run: |
          import json, urllib.request, time
          H = {"User-Agent": "Mozilla/5.0", "Referer": "https://www.nba.com/", "Origin": "https://www.nba.com"}
          def get(u):
              t = time.time()
              with urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=30) as r:
                  b = r.read()
              print("OK", u, len(b), "bytes", round(time.time() - t, 2), "s")
              return json.loads(b)
          def shape(o, d=0, maxd=4):
              if d > maxd: return "..."
              if isinstance(o, dict): return {k: shape(v, d + 1, maxd) for k, v in list(o.items())[:60]}
              if isinstance(o, list): return [shape(o[0], d + 1, maxd), "len=%d" % len(o)] if o else []
              return o
          s = get("https://cdn.nba.com/static/json/staticData/scheduleLeagueV2.json")
          ls = s["leagueSchedule"]; print("season", ls.get("seasonYear"), "dates", len(ls["gameDates"]))
          g0 = ls["gameDates"][0]["games"][0]; print("GAME KEYS", json.dumps(shape(g0, maxd=2))[:3000])
          uta = [g for d in ls["gameDates"] for g in d["games"] if "UTA" in (g["homeTeam"]["teamTricode"], g["awayTeam"]["teamTricode"]) and g["gameStatus"] == 3 and g["gameId"].startswith("002")]
          print("UTA finals", len(uta), [g["gameId"] for g in uta])
          gid = uta[-1]["gameId"]
          b = get("https://cdn.nba.com/static/json/liveData/boxscore/boxscore_%s.json" % gid)
          print("BOX", json.dumps(shape(b, maxd=5))[:6000])
          p = get("https://cdn.nba.com/static/json/liveData/playbyplay/playbyplay_%s.json" % gid)
          acts = p["game"]["actions"]; print("PBP actions", len(acts))
          seen = {}
          for a in acts:
              k = (a.get("actionType"), a.get("subType"))
              if k not in seen: seen[k] = a
          for k, a in list(seen.items())[:40]: print("ACT", k, json.dumps(a)[:900])
          for gidp in ["0022500001", "0022501230"]:
              try: get("https://cdn.nba.com/static/json/liveData/boxscore/boxscore_%s.json" % gidp)
              except Exception as e: print("FAIL", gidp, e)
          try: get("https://cdn.nba.com/static/json/liveData/playbyplay/playbyplay_0022500500.json")
          except Exception as e: print("FAIL old pbp", e)
          try:
              u = "https://stats.nba.com/stats/leaguedashteamstats?LeagueID=00&Season=2026-27&SeasonType=Regular+Season&MeasureType=Base&PerMode=PerGame"
              get(u)
          except Exception as e: print("FAIL stats", e)
